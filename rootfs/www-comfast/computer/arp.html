<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
	<style>
			body::-webkit-scrollbar {
			      display: none;
			   width: 0 !important;
			  }
		</style>
</head>
<body module="arp" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->

    <div class="content_box clearfix">
        <div class="content container-fluid clearfix">
            <div class="firewall_tab">
                <div class="row firewall_head">
                    <div class="col-xs-4">
                        <span sh_lang="SHpack.arp" id="firewall"></span>
                    </div>
                    <div class="col-xs-8 btngroup">
                        <a class="btn btn-warning" id="add" data-name="arp" et="click:add" sh_lang="SHpack.add"></a>
                        <a class="btn btn-warning" id="del" data-name="arp" et="click:delsele" sh_lang="SHpack.del_select"></a>
                    </div>
                </div>
                <div class="row">
                    <table width="100%">
                        <thead class="table_head">
                        <tr>
                            <th width="10%">
                                <input id="allchecked" type="checkbox" et="click:selectall" data-value="0"/>
                            </th>
                            <th width="10%" sh_lang="SHpack.number"></th>
                            <th width="20%" sh_lang="SHpack.ip_addr"></th>
                            <th width="12%" sh_lang="SHpack.mac"></th>
                            <th width="6%" sh_lang="SHpack.net_group"></th>
                            <th width="6%" sh_lang="SHpack.remarks"></th>
                            <th width="6%" sh_lang="SHpack.status"></th>
                            <th width="6%" sh_lang="SHpack.operation"></th>
                        </tr>
                        </thead>
                        <tbody id="arp_table">
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>
<div class="mask"></div>
<input type="text" id="real_num" style="display: none"/>
<div class="add_box arp_add">
    <div class="add_box_head">
        <i class="iconfont icon-cuowu" et="click:closewin"></i>
        <h4><span sh_lang="SHpack.add"></span><span sh_lang="SHpack.arp"></span></h4>
    </div>
    <div class="add_box_body">
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.ip_addr"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="arp_ip_src" class="require isIp" sh_lang="SHeg.ip"/></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.mac"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="arp_mac_src" class="require isMac" sh_lang="SHeg.mac"/></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row">
                    <span sh_lang="SHpack.net_group"></span>
                </div>
            </div>
            <div class="col-xs-8">
                <div class="row">
                    <select id="arp_ifname_src">
                        <option value="wan">WAN</option>
                        <option value="lan">LAN</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.remarks"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="arp_remark_src" sh_lang="SHpack.remarks" maxlength="32"/></div>
            </div>
        </div>
    </div>
    <div class="add_box_foot clearfix">
        <button class="btn btn-warning pull-right firewall_save ifbtn" sh_lang="SHpack.save" et="click:save"></button>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
	<style>
			body::-webkit-scrollbar {
			      display: none;
			   width: 0 !important;
			  }
		</style>
</head>
<body module="upgrade" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->
    <div class="content_box clearfix">
        <div class="content clearfix">
            <div class="set_seat">
                <div class="shbox clearfix">
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.upgrade"></label>
                        <ul class="clearfix system">
                            <li class="clearfix">
                                <label class="row_name" sh_lang="SHpack.system_version"></label>
                                <label id="current_version"></label>
                            </li>
                            <li class="clearfix">
                                <label class="row_name" sh_lang="SHpack.upload_sys"></label>
                                <label for="firmware_upg" class="clearfix btn btn-warning" sh_lang="SHpack.select_file"></label>
                                <input type="file" accept=".bin" name="firmware_upg" class="clearfix" id="firmware_upg"
                                       style="position: fixed;top: -999px;">
                                <span class="showFileName" id="firmware_upg_text"></span>
                            </li>
                            <li class="clearfix">
                                <label class="row_name"></label>
                                <input type="checkbox" id="keep_settings" name="keep_settings">
                                <label for="keep_settings" sh_lang="SHpack.keep_settings"></label>
                            </li>
                            <li class="clearfix">
                                <label class="row_name"></label>
                                <button class="btn btn-warning" et="click:system_uploadfile" sh_lang="SHpack.update"></button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

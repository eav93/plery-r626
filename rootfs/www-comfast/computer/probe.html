<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
</head>
<body module="probe" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->
    <div class="content clearfix">
        <div class="wizard">
            <div class="wizard_man">
                <div class="wizard_box">
                    <div class="shbox clearfix">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHtips.probe_server_config"></label>
                            <ul class="clearfix shbox_cont">
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.remoteswitch"></label>
                                    <span class="right">
                                    <select id="remote_switch" class="text">
                                        <option value="1" sh_lang="SHpack.enable"></option>
                                        <option value="0" sh_lang="SHpack.disable"></option>
                                    </select>
                                </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHtips.probe_radio"></label>
                                    <span class="right">
                                    <select id="radio" class="text"></select>
                                </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHtips.probe_addr"></label>
                                    <span class="right">
                                        <input class="text require isDomain" id="probe_addr"/>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHtips.probe_port"></label>
                                    <span class="right">
                                        <input class="text require isPort" id="probe_port"/>
                                    </span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <span class="btn btn-warning" et="click tap:saveConfig" sh_lang="SHpack.optimised"></span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

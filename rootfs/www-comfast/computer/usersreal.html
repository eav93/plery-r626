<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="renderer" content="webkit">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
		<meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-control" content="no-cache">
		<meta http-equiv="Cache" content="no-cache">
		<title></title>
		<link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon" />
		<link rel="stylesheet" href="/css/shreset.css" />
		<link rel="stylesheet" href="/css/pc/shap.css" />
		<style>
			#user_tbody .iconfont, #black_info .iconfont {font-size: 18px;}
				body::-webkit-scrollbar {
				display: none;
				width: 0 !important;
				}
    </style>
	</head>
	<body module="usersreal" device="computer" id="mbox_container">
		<div class="container-fluid header">
			<div class="row">
				<div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
				<ul class="out">
					<li id="login_out">
						<a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
					</li>
				</ul>
			</div>
		</div>
		<div class="wapper clearfix">
			<div class="subMenu clearfix" id="subMenu">
				<ul class="navigation clearfix"></ul>
			</div>
			<!--#submenu-->

			<div class="content_box clearfix">
				<div class="content container-fluid clearfix">
					<div class="shbox clearfix">
						<div class="shbox_border user_tab">
							<label class="title" sh_lang="SHpack.currentdevice"></label>
							<ul class="clearfix shbox_cont">
								<table width="100%">
									<thead class="table_head">
										<tr>
											<th width="18%" sh_lang="SHpack.devname"></th>
											<th width="16%">IP</th>
											<th width="16%" class="thmac">MAC</th>
											<th width="10%" sh_lang="SHpack.uplink"></th>
											<th width="10%" sh_lang="SHpack.downlink"></th>
											<th width="10%" sh_lang="SHpack.ontime"></th>
											<th width="10%" sh_lang="SHpack.joinblack"></th>
										</tr>
									</thead>
									<tbody id="user_tbody"></tbody>
								</table>
							</ul>
						</div>
					</div>

					<div class="shbox clearfix">
						<div class="shbox_border user_tab">
							<label class="title" sh_lang="SHpack.nointernet"></label>
							<ul class="clearfix shbox_cont">
								<table width="100%">
									<thead class="table_head">
										<tr>
											<th width="10%" sh_lang="SHpack.devname"></th>
											<th width="16%">MAC</th>
											<th width="10%" sh_lang="SHpack.removeblack">允许上网</th>
										</tr>
									</thead>
									<tbody id="black_info"></tbody>
								</table>
							</ul>
						</div>
					</div>

					<div class="copyright" sh_lang="SHpack.copyright1"></div>
				</div>
			</div>
		</div>
		<div class="mask"></div>
		<input type="text" id="real_num" class="hide" />
		<div class="add_box hide">
			<div class="add_box_head">
				<i class="iconfont icon-cuowu" et="click:closewin"></i>
				<h4><span sh_lang="SHpack.add"></span><span sh_lang="SHpack.mac_filter"></span></h4>
			</div>
			<div class="add_box_body">
				<div class="add_box_list clearfix">
					<div class="col-xs-4">
						<div class="row"><span sh_lang="SHpack.mac"></span></div>
					</div>
					<div class="col-xs-8">
						<div class="row"><input type="text" id="mac_src" class="require isMac" sh_lang="SHeg.mac" /></div>
					</div>
				</div>
				<div class="add_box_list clearfix">
					<div class="col-xs-4">
						<div class="row"><span sh_lang="SHpack.remarks"></span></div>
					</div>
					<div class="col-xs-8">
						<div class="row"><input type="text" id="mac_reamek" sh_lang="SHpack.remarks" /></div>
					</div>
				</div>
			</div>
			<div class="add_box_foot clearfix">
				<button class="btn btn-warning pull-right firewall_save ifbtn" et="click:save" sh_lang="SHpack.save"></button>
			</div>
		</div>
	</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
	var moduleName = document.body.getAttribute("module");
	if (moduleName) {
		seajs.use([moduleName], function(page) {
			page.init();
		});
	}
</script>

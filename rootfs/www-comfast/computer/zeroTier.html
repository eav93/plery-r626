<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
	<style>
			body::-webkit-scrollbar {
			      display: none;
			   width: 0 !important;
			  }
		</style>
</head>
<body module="zeroTier" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->

    <div class="content_box clearfix">
        <div class="content clearfix">
            <div class="set_seat">
                <div class="shbox clearfix">
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.zeroTier"></label>
                        <ul class="clearfix shbox_cont">
                            <li class="list clearfix">
                                <label class="left" sh_lang="SHpack.zt_switch"></label>
                                <span class="right">
                                    <select id="zt_switch" et="change:enableConfig" class="text">
                                        <option sh_lang="SHpack.enable" value="1"></option>
                                        <option sh_lang="SHpack.disable" value="0"></option>
                                    </select>
                                </span>
                            </li>
                            <li class="list clearfix">
                                <label class="left" sh_lang="SHpack.zt_id"></label>
                                <span class="right">
                                    <input type="text" id="zt_value" class="text require isEnglish">
                                </span>
                            </li>
                            <li class="list clearfix">
                                <label class="left" sh_lang="SHpack.zt_nat"></label>
                                <span class="right">
                                    <select id="zt_nat" class="text">
                                        <option sh_lang="SHpack.enable" value="1"></option>
                                        <option sh_lang="SHpack.disable" value="0"></option>
                                    </select>
                                </span>
                            </li>
                            <li class="list clearfix">
                                <label class="left"><button class="btn btn-warning" et="click:go_href">Zerotier.com</button></label>
                                <span class="right">
                                    <span sh_lang="SHpack.zt_note"></span>
                                </span>
                            </li>
                            <li class="list clearfix">
                                <label sh_lang="SHpack.advanced"></label>
                                <span class="adv_box" data-value="checkbox_24g">
                                    <input type="checkbox" id="checkbox_24g" class="MCB">
                                </span>
                            </li>
                        </ul>
                    </div>
                    <div class="shbox clearfix advanced hide checkbox_24g">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.advanced"></label>
                            <ul class="clearfix shbox_cont"> 
                                <li class="list clearfix">
                                    <label sh_lang="SHpack.zt_port" class="left"></label>
                                    <span class="right">
                                        <input type="text" id="zt_port" class="text require isPort">
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label sh_lang="SHpack.zt_key" class="left"></label>
                                    <span class="right">
                                        <input type="text" id="zt_key" class="text require isEnglish">
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.zt_config"></label>
                                    <span class="right">
                                        <select id="zt_config" class="text">
                                            <option sh_lang="SHpack.enable" value="1"></option>
                                            <option sh_lang="SHpack.disable" value="0"></option>
                                        </select>
                                    </span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                
                <button class="btn btn-warning" et="click:set_config" sh_lang="SHpack.modify"></button>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>

</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

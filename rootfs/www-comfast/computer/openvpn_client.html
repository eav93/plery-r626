<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
</head>
<body module="openvpn_client" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->

    <div class="content_box clearfix">
        <div class="content clearfix" style="display: flex;align-items: center;">
            <div class="set_seat">
                <div class="shbox clearfix">
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.openvpn_client"></label>
                        <ul class="clearfix shbox_cont">
                            <li class="list clearfix">
                                <label class="left" sh_lang="SHpack.remoteswitch"></label>
                                <span class="right">
                                    <select id="openvpnclient_switch" et="change:enableConfig" class="text">
                                        <option sh_lang="SHpack.enable" value="1"></option>
                                        <option sh_lang="SHpack.disable" value="0"></option>
                                    </select>
                                </span>
                            </li>
                            <div class="list allform">
                                <li class="list clearfix">
                                    <label class="left">Verb</label>
                                    <span class="right">
                                        <select class="text" id="verb">
                                            <option value="0">0</option>
                                            <option value="1">1</option>
                                            <option value="2">2</option>
                                            <option value="3">3</option>
                                            <option value="4">4</option>
                                            <option value="5">5</option>
                                            <option value="6">6</option>
                                            <option value="7">7</option>
                                            <option value="8">8</option>
                                            <option value="9">9</option>
                                            <option value="10">10</option>
                                            <option value="11">11</option>
                                        </select>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left">Nobind</label>
                                    <span class="right">
                                        <select id="nobind" class="text">
                                            <option sh_lang="SHpack.enable" value="1"></option>
                                            <option sh_lang="SHpack.disable" value="0"></option>
                                        </select>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.openvpn_mode"></label>
                                    <span class="right">
                                        <select id="client" class="text">
                                            <option sh_lang="SHpack.enable" value="1"></option>
                                            <option sh_lang="SHpack.disable" value="0"></option>
                                        </select>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.openvpn_remote"></label>
                                    <span class="right">
                                        <input type="text" id="remote" class="text require isZeroIp">
                                    </span>
                                </li>

                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.zt_port"></label>
                                    <span class="right">
                                        <input type="text" id="port" class="text require isNum isNULL" name="_@1_65535">
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.openvpn_server"></label>
                                    <span class="right">
                                        <input type="text" id="openvpn_server" class="text require isZeroIp">
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.openvpn_mask"></label>
                                    <span class="right">
                                        <input type="text" id="service_mask" class="text require isNetmask">
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.dui_gateway"></label>
                                    <span class="right">
                                        <input type="text" id="dui_gateway" class="text require isZeroIp">
                                    </span>
                                </li>
                            </div>
                            <li class="list clearfix">
                                <label class="left" sh_lang="SHpack.protocol"></label>
                                <span class="right">
                                    <select id="proto" class="text" disabled>
                                        <option value="udp">UDP</option>
                                        <option value="tcp">TCP</option>
                                    </select>
                                </span>
                            </li>
                            
                        </ul>
                    </div>
                    <button class="btn btn-warning" et="click:setmode" sh_lang="SHpack.modify"></button>
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.openvpn_book"></label>
                        <ul class="clearfix shbox_cont">
                            <li class="list clearfix">
                                <label class="left">ca</label>
                                <span class="right">
                                    <label class="btn btn-warning" sh_lang="SHpack.openvpn_upgrade_client" for="backup_file_ca"></label>
                                    <input type="file" accept=".file" name="backup_file" id="backup_file_ca" style="position: fixed;top: -999px;">
                                </span>
                            </li>
                            <li class="list clearfix">
                                <label class="left">cert</label>
                                <span class="right">
                                    <label class="btn btn-warning" sh_lang="SHpack.openvpn_upgrade_client" for="backup_file_cert"></label>
                                    <input type="file" accept=".file" name="backup_file" id="backup_file_cert" style="position: fixed;top: -999px;">
                                </span>
                            </li>
                            <li class="list clearfix">
                                <label class="left">key</label>
                                <span class="right">
                                    <label class="btn btn-warning" sh_lang="SHpack.openvpn_upgrade_client" for="backup_file_key"></label>
                                    <input type="file" accept=".file" name="backup_file" id="backup_file_key" style="position: fixed;top: -999px;">
                                </span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>

</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

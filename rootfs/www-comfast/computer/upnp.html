<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
	<style>
			body::-webkit-scrollbar {
			      display: none;
			   width: 0 !important;
			  }
.firewall_head {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
              /* switch start*/

.switch_ext {
    width: 57px;
    height: 24px;
    border-radius: 15px;
    cursor: pointer;
    position: relative;
}

.switch_ext span {
    display: none;
    position: absolute;
    font-size: 10px;
    font-size: 12px;
    line-height: 22px;
    font-weight: 600;
    color: #ffffff;
}

.switch_with {
    width: 18px;
    height: 18px;
    border-radius: 12px;
    position: absolute;
    background: white;
    box-shadow: 0px 1px 4px rgba(0, 0, 0, 0.4);
}

.switchopen {
    background: #6dbb35;
    filter: alpha(opacity=80);
}

.switchopen > .switch_with {
    top: 3px;
    right: 3px;
}

.switchopen > span.on {
    display: block;
    left: 12px;
}

.switchclose {
    background: #c9151a;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-left: transparent;
}

.switchclose > .switch_with {
    left: 3px;
    top: 2px;
    top: 3px;
    border: 1px solid #ffffff;
}

.switchclose > span.off {
    display: block;
    right: 8px;
}

/* switch end*/
		</style>
</head>
<body module="upnp" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->

    <div class="content_box clearfix">
        <div class="content container-fluid clearfix">
            <div class="firewall_tab">
                <div class="firewall_head">
                    <div>
                        <span sh_lang="SHpack.upnp"></span>
                    </div>
                    <div style="display: flex;align-items: center;">
                        <span style="padding: 0 12px;" sh_lang="SHpack.upnpswitch"></span>
                            <div id="switch"
                                 class="switch_ext"
                                 et="click tap:changestatus">
                                <span class="on" et="click tap:changestatus">ON</span>
                                <span class="off" et="click tap:changestatus">OFF</span>
                                <div class="switch_with" et="click tap:changestatus"></div>
                            </div>
                    </div>
                        
                </div>
                <div class="row">
                    <table width="100%">
                        <thead class="table_head">
                            <tr>
                                <th width="15%" sh_lang="SHpack.number"></th>
                                <th width="15%" sh_lang="SHpack.agreement"></th>
                                <th width="20%" sh_lang="SHpack.lanaddr"></th>
                                <th width="15%" sh_lang="SHpack.wanport"></th>
                                <th width="15%" sh_lang="SHpack.lanport"></th>
                                <th width="20%" sh_lang="SHpack.desc"></th>
                            </tr>
                        </thead>
                        <tbody id="port_table"></tbody>
                    </table>
                    <div class="page clearfix" id="port_page">
                        <div class="PageInfo clearfix"></div>
                        <ul class="clearfix PageCode"></ul>
                    </div>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>
<div class="mask"></div>
<input type="text" id="real_num" style="display: none"/>
<div class="add_box port_add">
    <div class="add_box_head">
        <i class="iconfont icon-cuowu" et="click:closewin"></i>
        <h4><span sh_lang="SHpack.add"></span><span sh_lang="SHpack.port_forward"></span></h4>
    </div>
    <div class="add_box_body">
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.ip_addr"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="ip_src" class="require isIp" sh_lang="SHeg.ip"/></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row">
                    <span sh_lang="SHpack.agreement"></span>
                </div>
            </div>
            <div class="col-xs-8">
                <div class="row">
                    <select id="pf_proto_select" et="change:protoConfig">
                        <option value="tcp udp">TCP UDP</option>
                        <option value="tcp">TCP</option>
                        <option value="udp">UDP</option>
                        <option value="all">ALL</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.start_port"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="startport" class="require isPort startport"
                                        sh_lang="SHpack.start_port"/></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.end_port"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="endport" class="require isPort endport"
                                        sh_lang="SHpack.end_port"/></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.remarks"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="pf_comment" sh_lang="SHpack.remarks" maxlength="32"/></div>
            </div>
        </div>
    </div>
    <div class="add_box_foot clearfix">
        <button class="btn btn-warning pull-right firewall_save ifbtn" et="click:save" sh_lang="SHpack.save"></button>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

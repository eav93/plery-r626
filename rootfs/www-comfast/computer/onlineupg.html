<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
</head>
<body module="onlineupg" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->
    <div class="content_box clearfix">
        <div class="content clearfix">
            <div class="set_seat">
                <div class="shbox clearfix">
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.OnlineUpg"></label>
                        <ul class="clearfix system split-form split-30">
                            <li class="clearfix">
                                <label class="row_name" sh_lang="SHpack.AutoUpgSwitch"></label>
                                <span class="row_value">
                                    <select id="auto_upgrade_switch" class="text" et="change:auto_upgrade_switch">
                                        <option value="1" sh_lang="SHpack.enable"></option>
                                        <option value="0" sh_lang="SHpack.disable"></option>
                                    </select>
                                </span>
                            </li>
                            <li class="clearfix">
                                <label class="row_name" sh_lang="SHpack.current_ver"></label>
                                <span class="row_value">
                                    <label id="InstalledVersion"></label>
                                </span>
                            </li>
                            <li class="clearfix" id="NewVersionRow" style="display:none">
                                <label class="row_name" sh_lang="SHpack.BestNewVersion"></label>
                                <span class="row_value">
                                    <label id="CurrentVersion"></label>
                                </span>
                            </li>
                            <li class="clearfix">
                                <label class="row_name"></label>
                                <span class="row_value">
                                    <label id="UpgTip" style="font-size: 12px;"></label>
                                </span>
                            </li>
                            <li class="clearfix" style="display: none" id="ManualDown">
                                <label class="row_name"></label>
                                <span class="row_value">
                                    <button class="btn btn-warning" et="click:manual_check" style="min-width: 120px"
                                            sh_lang="SHpack.ManualCheck"></button>
                                </span>
                            </li>
                            <li class="clearfix" style="display: none" id="ClearDown">
                                <label class="row_name"></label>
                                <span class="row_value">
                                    <button class="btn btn-warning" et="click:cancel_down" style="min-width: 120px"
                                            sh_lang="SHpack.CancelDown"></button>
                                </span>
                            </li>
                            <li class="clearfix" style="display: none" id="Update">
                                <label class="row_name"></label>
                                <span class="row_value">
                                    <button class="btn btn-warning" et="click:online_upgrade" style="min-width: 120px"
                                            sh_lang="SHpack.OnlineUpg"></button>
                                </span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon" />
    <!-- CSS -->
    <link rel="stylesheet" href="/css/shreset.css">
    <link rel="stylesheet" href="/css/pc/login.css">
    <style>
        body::-webkit-scrollbar {
            display: none;
            width: 0 !important;
        }
        .login_footer {
            height: 60px;
            background-color: #1d1e1f;
            color: #b3b3b3;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .icon-duoyuyan, .icon-lock {
            position: absolute;
            bottom: 13px;
            left: 13px;
            color: #fff;
        }

        /* 下拉框 */
        .selectDiv {
            position: relative;
            font-size: 14px;
            width: 100%;
            height: 42px;
            background: #da9f1b;
            box-shadow: 0 2px 3px 0 rgba(0, 0, 0, .1) inset;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 6px;
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .myselect {
            position: absolute;
            width: 100%;
            height: 42px;
            left: 0;
            top: 0;
            opacity: 0;
        }

        .icon-right {
            position: absolute;
            right: 10px;
            top: 14px;
            border-right: 2px solid;
            border-bottom: 2px solid;
            transform: rotate(45deg);
            width: 8px;
            height: 8px;
            color: #fff;
        }
        #selected {
            color: #fff;
        }
    </style>
</head>

<body id="mbox_container" device="computer" module="login">

    <div class="page-container" id="login_area">
        <h1><a id="logo_herf" target="_blank"><img src="/images/logo.png" /></a></h1>
        <!--<form action="" method="post">-->
        <div id="psdbox" class="psdboxs">
            <div class="selectDiv">
                <span class="icon-duoyuyan"></span>
                <div class="icon-right"></div>
                <span id="selected">Русский</span>
                <select class="myselect" id="l_select" et="change:language_change">
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                    <option value="cn">简体中文</option>
                </select>
            </div>
            <div class="psdbox place hide" id="newpsdbox">
                <input type="text" class="password" id="newpsd" sh_lang="SHpack.login_tips">
            </div>
            <div class="psdbox place hide" id="passwordbox">
                <input type="password" class="password" id="password" sh_lang="SHpack.login_tips">
            </div>
        </div>
        <button type="submit" class="submit_button" id="login_btn" et="click:login" sh_lang="SHpack.login"></button>
        <!--</form>-->
    </div>
    <div class="login_footer">
        <div sh_lang="SHpack.copyright1"></div>
    </div>
</body>

</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

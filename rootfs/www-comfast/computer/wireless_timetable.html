<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon" />
    <link rel="stylesheet" href="/css/shreset.css" />
    <link rel="stylesheet" href="/css/pc/shap.css" />
</head>

<body module="wireless_timetable" device="computer" id="mbox_container">
    <div class="container-fluid header">
        <div class="row">
            <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
            <ul class="out">
                <li id="login_out">
                    <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
                </li>
            </ul>
        </div>
    </div>
    <div class="wapper clearfix">
        <div class="subMenu clearfix" id="subMenu">
            <ul class="navigation clearfix"></ul>
        </div>
        <!--#submenu-->

        <div class="content_box clearfix">
            <div class="content clearfix">
                <div class="set_seat">
                    <div class="shbox clearfix" id="wan_info">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.wireless_timetable"></label>
                            <ul class="clearfix shbox_cont">
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.wireless_timetable"></label>
                                    <span class="right place">
                                        <select class="text" id="swich_time" et="change:swich_time">
                                            <option value="1" sh_lang="SHpack.enable"></option>
                                            <option value="0" sh_lang="SHpack.disable"></option>
                                        </select>
                                    </span>
                                </li>
                                <div id="time_box">
                                    <li class="" style="padding-top: 8px">
                                        <ol class="list clearfix">
                                            <div
                                                class="col-lg-8 col-sm-10 col-xs-12 col-lg-offset-2 col-sm-offset-1 col-xs-offset-0 weeks_check_0">
                                                <div class=" col-xs-3 text-center">
                                                    <label for="weeks" sh_lang="SHpack.weeks_all"></label>
                                                    <input type="checkbox" class="one_week" data-value="0"
                                                        et="change:check_weeks" id="weeks">
                                                </div>
                                                <div class=" col-xs-3 text-center">
                                                    <label for="mon" sh_lang="SHpack.MON"></label>
                                                    <input type="checkbox" et="change:check_week" data-value="0"
                                                        class="week_0 check_week" id="mon" value="mon">
                                                </div>
                                                <div class="col-xs-3 text-center">
                                                    <label for="tue" sh_lang="SHpack.TUE"></label>
                                                    <input type="checkbox" et="change:check_week" data-value="0"
                                                        class="week_0 check_week" id="tue" value="tue">
                                                </div>
                                                <div class="col-xs-3 text-center">
                                                    <label for="wed" sh_lang="SHpack.WED"></label>
                                                    <input type="checkbox" et="change:check_week" data-value="0"
                                                        class="week_0 check_week" id="wed" value="wed">
                                                </div>
                                                <div class="col-xs-3 text-center">
                                                    <label for="thu" sh_lang="SHpack.THU"></label>
                                                    <input type="checkbox" et="change:check_week" data-value="0"
                                                        class="week_0 check_week" id="thu" value="thu">
                                                </div>
                                                <div class="col-xs-3 text-center">
                                                    <label for="fri" sh_lang="SHpack.FRI"></label>
                                                    <input type="checkbox" et="change:check_week" data-value="0"
                                                        class="week_0 check_week" id="fri" value="fri">
                                                </div>
                                                <div class="col-xs-3 text-center">
                                                    <label for="sat" sh_lang="SHpack.SAT"></label>
                                                    <input type="checkbox" et="change:check_week" data-value="0"
                                                        class="week_0 check_week" id="sat" value="sat">
                                                </div>
                                                <div class="col-xs-3 text-center">
                                                    <label for="sun" sh_lang="SHpack.SUN"></label>
                                                    <input type="checkbox" et="change:check_week" data-value="0"
                                                        class="week_0 check_week" id="sun" value="sun">
                                                </div>
                                            </div>
                                        </ol>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.wire_time_slot"></label>
                                        <span class="right place">
                                            <select class="textMin" id="start_hour"
                                                style="width: 54px; display: inline-block">
                                                <option value="00">00</option>
                                                <option value="01">01</option>
                                                <option value="02">02</option>
                                                <option value="03">03</option>
                                                <option value="04">04</option>
                                                <option value="05">05</option>
                                                <option value="06">06</option>
                                                <option value="07">07</option>
                                                <option value="08">08</option>
                                                <option value="09">09</option>
                                                <option value="10">10</option>
                                                <option value="11">11</option>
                                                <option value="12">12</option>
                                                <option value="13">13</option>
                                                <option value="14">14</option>
                                                <option value="15">15</option>
                                                <option value="16">16</option>
                                                <option value="17">17</option>
                                                <option value="18">18</option>
                                                <option value="19">19</option>
                                                <option value="20">20</option>
                                                <option value="21">21</option>
                                                <option value="22">22</option>
                                                <option value="23">23</option>
                                            </select>
                                            <select class="textMin" id="start_minute"
                                                style="width: 54px; display: inline-block">
                                                <option value="00">00</option>
                                                <option value="05">05</option>
                                                <option value="10">10</option>
                                                <option value="15">15</option>
                                                <option value="20">20</option>
                                                <option value="25">25</option>
                                                <option value="30">30</option>
                                                <option value="35">35</option>
                                                <option value="40">40</option>
                                                <option value="45">45</option>
                                                <option value="50">50</option>
                                                <option value="55">55</option>
                                            </select>
                                            <span>-</span>
                                            <select class="textMin" id="end_hour"
                                                style="width: 54px;display: inline-block">
                                                <option value="00">00</option>
                                                <option value="01">01</option>
                                                <option value="02">02</option>
                                                <option value="03">03</option>
                                                <option value="04">04</option>
                                                <option value="05">05</option>
                                                <option value="06">06</option>
                                                <option value="07">07</option>
                                                <option value="08">08</option>
                                                <option value="09">09</option>
                                                <option value="10">10</option>
                                                <option value="11">11</option>
                                                <option value="12">12</option>
                                                <option value="13">13</option>
                                                <option value="14">14</option>
                                                <option value="15">15</option>
                                                <option value="16">16</option>
                                                <option value="17">17</option>
                                                <option value="18">18</option>
                                                <option value="19">19</option>
                                                <option value="20">20</option>
                                                <option value="21">21</option>
                                                <option value="22">22</option>
                                                <option value="23">23</option>
                                            </select>
                                            <select class="textMin" id="end_minute"
                                                style="width: 54px;display: inline-block">
                                                <option value="00">00</option>
                                                <option value="05">05</option>
                                                <option value="10">10</option>
                                                <option value="15">15</option>
                                                <option value="20">20</option>
                                                <option value="25">25</option>
                                                <option value="30">30</option>
                                                <option value="35">35</option>
                                                <option value="40">40</option>
                                                <option value="45">45</option>
                                                <option value="50">50</option>
                                                <option value="55">55</option>
                                            </select>
                                        </span>
                                    </li>
                                </div>
                        </div>
                    </div>
                    <!-- <button class="btn btn-warning" et="click:doResetConfig" sh_lang="SHpack.reset"></button> -->
                    <button class="btn btn-warning" et="click:setmode" sh_lang="SHpack.modify"></button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

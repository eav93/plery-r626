<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
</head>
<body module="tools" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->
    <div class="content_box clearfix">
        <div class="content clearfix">
            <div class="set_seat">
                <div class="shbox clearfix">
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.system_son"></label>
                        <ul class="clearfix system">
                            <li class="clearfix">
                                <label class="row_name" sh_lang="SHpack.configure"></label>:
                                <button class="btn btn-warning" href="javascript:void(0)" et="click:factory_reset"
                                        sh_lang="SHpack.wipe_data"></button>
                                <label class="btn btn-warning" sh_lang="SHpack.Import" for="backup_file"></label>
                                <input type="file" accept=".file" name="backup_file" id="backup_file"
                                       style="position: fixed;top: -999px;">
                                <button class="btn btn-warning hide" et="click:set_setting"
                                        id="backup_file_btn"></button>

                                <button class="btn btn-warning" href="javascript:;" et="click:get_setting"
                                        sh_lang="SHpack.Export"></button>
                            </li>
                            <li class="clearfix">
                                <label class="row_name" sh_lang="SHpack.system_version"></label>:
                                <label id="current_version"></label>
                            </li>
                            <li class="clearfix">
                                <label class="row_name" sh_lang="SHpack.upgrade"></label>:
                                <label for="firmware_upg" class="clearfix btn btn-warning"
                                       sh_lang="SHpack.select_file"></label>
                                <input type="file" accept=".bin" name="firmware_upg" class="clearfix" id="firmware_upg"
                                       style="position: fixed;top: -999px;">
                                <span class="showFileName" id="firmware_upg_text"></span>
                                <span class="fileerrorTip"></span>
                                <!--<input type="file" accept=".bin" class="dn" id="firmware_upg" et="change:system_upgrade">-->
                                <button class="btn btn-warning" et="click:system_uploadfile"
                                        sh_lang="SHpack.update"></button>
                            </li>
                            <li class="clearfix">
                                <label class="row_name" sh_lang="SHpack.logs"></label>:
                                <a class="btn btn-warning" href="logs.html" target="_blank"
                                   sh_lang="SHpack.viewlog"></a>
                            </li>
                            <!--<li class="clearfix">
                                <label class="row_name" sh_lang="SHpack.led_swich"></label>:
                                <span class="led_box">
                                    <input type="checkbox" autocomplete="off" id="led_swich" class="MCB">
                                </span>
                            </li>-->
                            <li class="clearfix">
                                <label class="row_name"></label>&nbsp;&nbsp;
                                <button class="btn btn-warning" href="javascript:void(0)" et="click:reboot"
                                        sh_lang="SHpack.reboot"></button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

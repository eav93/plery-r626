<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
	<style>
			body::-webkit-scrollbar {
			      display: none;
			   width: 0 !important;
			  }
		</style>
</head>
<body module="ddos" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->

    <div class="content_box clearfix">
        <div class="content clearfix">
            <div class="set_seat">
                <div class="shbox clearfix">
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.ddos"></label>
                        <div class="ddos clearfix">
                            <div class="list clearfix">
                                <div class="col-xs-6">
                                    <div class="row"><span sh_lang="SHpack.enable_icmp"></span><input
                                            class="option-input" id="enable_icmp" type="checkbox"></div>
                                </div>
                                <div class="col-xs-6">
                                    <div class="row"><span sh_lang="SHpack.enable_udp"></span><input
                                            class="option-input" id="enable_udp" type="checkbox"></div>
                                </div>
                            </div>
                            <div class="list clearfix">
                                <div class="col-xs-6">
                                    <div class="row"><span sh_lang="SHpack.enable_syn"></span><input
                                            class="option-input" id="enable_syn" type="checkbox"></div>
                                </div>
                                <div class="col-xs-6">
                                    <div class="row"><span sh_lang="SHpack.enable_null"></span><input
                                            class="option-input" id="enable_null" type="checkbox"></div>
                                </div>
                            </div>
                            <div class="list clearfix">
                                <div class="col-xs-6">
                                    <div class="row"><span sh_lang="SHpack.enable_fin"></span><input
                                            class="option-input" id="enable_fin" type="checkbox"></div>
                                </div>
                                <div class="col-xs-6">
                                    <div class="row"><span sh_lang="SHpack.enable_xmas"></span><input
                                            class="option-input" id="enable_xmas" type="checkbox"></div>
                                </div>
                            </div>
                            <div class="list clearfix">
                                <div class="col-xs-6">
                                    <div class="row"><span sh_lang="SHpack.enable_smurf"></span><input
                                            class="option-input" id="enable_smurf" type="checkbox"></div>
                                </div>
                                <div class="col-xs-6">
                                    <div class="row"><span sh_lang="SHpack.enable_ping"></span><input
                                            class="option-input" id="enable_ping" type="checkbox"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="list clearfix">
                        <div class="col-xs-12">
                            <div class="row">
                                <button class="btn btn-warning" sh_lang="SHpack.optimised"
                                        et="click:save_ddos"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>

</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

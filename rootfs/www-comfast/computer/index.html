<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <!--[if IE]>
    <script type="text/javascript" src="/common/lib/html5.js"></script>
    <script type="text/javascript" src="/common/lib/excanvas.js"></script>
    <![endif]-->
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
	<style>
		body::-webkit-scrollbar {
		      display: none;
		   width: 0 !important;
		  }
	</style>
</head>
<body module="index" device="computer" id="mbox_container">
<div class="container-fluid">
    <div class="row">
        <div class="header">
            <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
            <ul class="out">
                <li id="login_out">
                    <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
                </li>
            </ul>
        </div>
    </div>
</div>
<div class="wapper clearfix">

    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->
    <div class="content_box clearfix">
        <div class="content clearfix" style="padding-bottom: 40px">
            <div class="clearfix">
                <div class="shbox clearfix col-xs-6">
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.current_state"></label>
                        <div class="clearfix shbox_cont">
                            <div>
                                <img id="mode_pic" style="height: 174px;margin: 0 auto" class="img-responsive">
                                <p style="text-align: center;" id="mode_text"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="clearfix col-xs-6">
                    <div class="row">
                        <div class="shbox clearfix col-xs-6">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.totalup"></label>
                                <label class="unit"><span sh_lang="SHpack.unit"></span>:<span id="upload_unit"></span></label>
                                <div class="clearfix shbox_cont total">
                                    <div class="clearfix">
                                        <div class="left"><i class="iconfont icon-faarrowup bg_totalup"></i></div>
                                        <div class="right f_totalup" id="upload"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="shbox clearfix col-xs-6">
                            <div class="shbox_border ">
                                <label class="title" sh_lang="SHpack.totaldown"></label>
                                <label class="unit"><span sh_lang="SHpack.unit"></span>:<span id="download_unit"></span></label>

                                <div class="clearfix shbox_cont total">
                                    <div class="clearfix">
                                        <div class="left"><i class="iconfont icon-faarrowdown bg_totaldown"></i></div>
                                        <div class="right f_totaldown" id="download"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="shbox clearfix col-xs-6">
                            <div class="shbox_border ">
                                <label class="title" sh_lang="SHpack.usernum"></label>
                                <div class="clearfix shbox_cont total">
                                    <div class="clearfix">
                                        <div class="left"><i class="iconfont icon-user bg_usernum"></i></div>
                                        <div class="right f_usernum" id="user_num"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="shbox clearfix col-xs-6">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.totallink"></label>
                                <div class="clearfix shbox_cont total">
                                    <div class="clearfix">
                                        <div class="left"><i class="iconfont icon-linknum bg_totallink"></i></div>
                                        <div class="right f_totallink" id="total_link"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="clearfix">
                <div class="shbox clearfix col-xs-6">
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.intertface"></label>
                        <div class="clearfix shbox_cont">
                            <div class="clearfix" style="height: 130px; position: relative;">
                                <ul class="intertface" id="port_list"></ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="shbox clearfix col-xs-3">
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.cpu_usage"></label>
                        <label class="unit"></label>
                        <div class="clearfix shbox_cont">
                            <div class="clearfix">
                            <span class="chart" id="cpuusage" data-percent="0">
												<span class="percent">0</span>%</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="shbox clearfix col-xs-3">
                    <div class="shbox_border">
                        <label class="title" sh_lang="SHpack.memory_usage"></label>
                        <label class="unit"></label>
                        <div class="clearfix shbox_cont">
                            <div class="clearfix">
                                <span class="chart" id="menusage" data-percent="0"><span
                                        class="percent">0</span>%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="clearfix" style="margin-bottom: 20px">
                <div class="clearfix col-xs-6" id="char_height">
                    <div class="row">
                        <div class="shbox clearfix col-xs-12">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.deviceinfo"></label>
                                <ul class="clearfix shbox_cont">
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.mac"></label>
                                        <span class="right" id="mac"></span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.unit_type"></label>
                                        <span class="right" id="deviceinfo"></span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.version"></label>
                                        <span class="right" id="version"></span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="shbox clearfix hide" id="wan_info">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.waninfo"></label>
                            <ul class="clearfix shbox_cont">
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.access"></label>
                                    <span id="wan_get_mode" class="right"></span>
                                </li>
                                <li class="list clearfix" id="wan_ip_info">
                                    <label class="left" sh_lang="SHpack.ip_addr"></label>
                                    <span id="wan_ip" class="right"></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="shbox clearfix hide" id="qmi_info">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.apn_mode"></label>
                            <ul class="clearfix shbox_cont">
                                <li class="list clearfix" id="4g_ip_info">
                                    <label class="left" sh_lang="SHpack.ip_addr"></label>
                                    <span id="4g_ip" class="right"></span>
                                </li>
                                <li class="list clearfix hidden" style="text-align: center" id="sim_status">
                                    <span sh_lang="SHpack.sim_unknown"></span>
                                </li>
                                <li class="list clearfix hidden apn_row">
                                    <label class="left" sh_lang="SHpack.apn_name"></label>
                                    <span id="apn_name" class="right"></span>
                                </li>
                                <li class="list clearfix hidden apn_row">
                                    <label class="left" sh_lang="SHpack.apn_network"></label>
                                    <span id="apn_network" class="right"></span>
                                </li>
                                <li class="list clearfix hidden apn_row">
                                    <label class="left" sh_lang="SHpack.modem_rsst"></label>
                                    <span id="apn_data" class="right"></span>
                                </li>
                                <li class="list clearfix hidden apn_row">
                                    <label class="left">ICCID</label>
                                    <span id="apn_iccid" class="right"></span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left">IMEI</label>
                                    <span id="apn_imei" class="right"></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="shbox clearfix hide" id="wireless_info">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.wifiinfo"></label>
                            <ul class="clearfix shbox_cont" id="wifishow">
                            </ul>
                        </div>
                    </div>
                    <div class="shbox clearfix hide" id="rep_info">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.bridgeinfo"></label>
                            <ul class="clearfix shbox_cont">
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.bridge_status"></label>
                                    <span class="right" id="rep_status"></span></li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.sta_ssid"></label>
                                    <span class="right" id="sta_ssid"></span></li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.modem_rsst"></label>
                                    <span class="right" id="rep_signal"></span></li>
                            </ul>
                        </div>
                    </div>
                    <div class="shbox clearfix hide" id="mesh_info">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.mesh_info"></label>
                            <ul class="clearfix shbox_cont">
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.mesh_status"></label>
                                    <span class="right" id="mesh_status"></span></li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.mesh_id"></label>
                                    <span class="right" id="mesh_id"></span></li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.modem_rsst"></label>
                                    <span class="right" id="mesh_signal"></span></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="clearfix col-xs-6">
                    <div class="shbox clearfix">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.total"></label>

                            <div class="unit">
                                <div class="l_up"><i class="iconfont icon-dian"></i><label
                                        sh_lang="SHpack.uplink"></label></div>
                                <div class="l_down"><i class="iconfont icon-dian"></i><label
                                        sh_lang="SHpack.downlink"></label></div>
                            </div>
                            <div class="clearfix box_cont">
                                <div id="flowchart"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>

</body>
</html>
<script type="text/javascript" src="/common/lib/jquery.js"></script>
<script type="text/javascript" src="/common/lib/highstock.js"></script>
<script type="text/javascript" src="/common/lib/jquery.easypiechart.js"></script>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

<!DOCTYPE html>
<html>
<head>
  <style>
    .card {
      position: relative;
      width: 200px;
      height: 200px;
      perspective: 1000px;
    }
    
    .front,
    .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      transition: transform 0.6s;
    }
    
    .front {
      background-color: #ffcc00;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: #ffffff;
    }
    
    .back {
      background-color: #ff3333;
      transform: rotateY(180deg);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: #ffffff;
    }
    
    .flipped {
      transform: rotateY(180deg);
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script>
    $(document).ready(function() {
      $('.card').click(function() {
        $(this).toggleClass('flipped');
      });
    });
  </script>
</head>
<body>
  <div class="card">
    <div class="front">
      正面内容
    </div>
    <div class="back">
      反面内容
    </div>
  </div>
</body>
</html>

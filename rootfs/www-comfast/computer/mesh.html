<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
</head>
<body module="mesh" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->

    <div class="content_box">
        <div class="content clearfix">
            <div class="wizard">
                <div class="shstep"></div>
                <div class="wizard_man">
                    <div class="wizard_box">
                        <div class="shbox clearfix">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.lan_set"></label>
                                <ul class="clearfix shbox_cont">
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.ip_addr"></label>
                                        <span class="right place">
                                            <input id="lan_ip_id" class="text require isIp" autocomplete="off"
                                                   type="text">
                                            <div class="tip" sh_lang="SHeg.ip"></div>
                                        </span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.netmask"></label>
                                        <span class="right place">
                                            <input id="lan_netmask_id" class="text require isNetmask" autocomplete="off"
                                                   type="text">
                                            <div class="tip" sh_lang="SHeg.netmask"></div>
                                        </span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <span class="btn btn-warning" et="click:next" sh_lang="SHpack.next"></span>
                    </div>
                    <div class="wizard_box hide">
                        <div class="shbox clearfix">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.mesh_set"></label>
                                <ul class="clearfix shbox_cont">
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.mesh_bind"></label>
                                        <span class="right">
                                           <select class="text" et="change:band_mesh" id="mesh_band"></select>
                                        </span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left">MESH ID</label>
                                        <span class="right place">
                                            <input id="sta_ssid_id" class="text require isSSID"
                                                   autocomplete="off" type="text">
                                        </span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.ssid_pwd"></label>
                                        <span class="right place">
                                            <input id="rep_ssid_pwd" class="text require isSSIDPwd" autocomplete="off"
                                                   type="text">
                                            <div class="tip" sh_lang="SHeg.emp832char"></div>
                                        </span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div class="shbox clearfix">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.advanced"></label>
                                <ul class="clearfix shbox_cont">
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.bandwidth"></label>
                                        <span class="right"><select class="text" et="change:htmode_mesh" id="htmode_mesh"></select></span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.country"></label>
                                        <span class="right">
                                            <select class="text country" id="country_mesh" et="change:country_mesh">
                                                <option value="UK" sh_lang="SHpack.country_es"></option>
                                                <option value="CN" sh_lang="SHpack.country_cn"></option>
                                                <option value="US" sh_lang="SHpack.country_us"></option>
                                                <option value="GB" sh_lang="SHpack.country_eu"></option>
                                            </select>
                                        </span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.channels"></label>
                                        <span class="right"><select class="text" et="change:channels_mesh" id="channels_mesh"></select></span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <span class="btn" et="click:prev" sh_lang="SHpack.prev"></span>
                        <span class="btn btn-warning" et="click:next" sh_lang="SHpack.next"></span>
                    </div>
                   
                    <div class="wizard_box w24g hide">
                        <div class="shbox clearfix">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.wifi24g"></label>
                                <ul class="clearfix shbox_cont">
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.ssid"></label>
                                        <span class="right place">
                                            <input id="ssid_id_24g" class="text require isSSID" type="text"
                                                   autocomplete="off">
                                            <div class="tip" sh_lang="SHeg.max32char"></div>
                                        </span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.ssid_pwd"></label>
                                        <span class="right place">
                                            <input id="psk_id_24g" class="text require isSSIDPwd" type="text"
                                                   autocomplete="off">
                                            <div class="tip" sh_lang="SHeg.emp832char"></div>
                                        </span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div class="shbox clearfix">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.advanced"></label>
                                <ul class="clearfix shbox_cont">
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.bandwidth"></label>
                                        <span class="right"><select class="text" id="htmode_24g"></select></span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.channels"></label>
                                        <span class="right"><select class="text" id="channels_24g"></select></span></li>
                                </ul>
                            </div>
                        </div>
                        <span class="btn" et="click:prev" sh_lang="SHpack.prev"></span>
                        <span class="btn btn-warning" et="click:nextend" sh_lang="SHpack.next"></span>
                    </div>
                    <div class="wizard_box w58g hide">
                        <div class="shbox clearfix">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.wifi58g"></label>
                                <ul class="clearfix shbox_cont">
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.ssid"></label>
                                        <span class="right place">
                                            <input id="ssid_id_58g" class="text require isSSID" type="text"
                                                   autocomplete="off">
                                            <div class="tip" sh_lang="SHeg.max32char"></div>
                                        </span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.ssid_pwd"></label>
                                        <span class="right place">
                                            <input id="psk_id_58g" class="text require isSSIDPwd" type="text"
                                                   autocomplete="off">
                                            <div class="tip" sh_lang="SHeg.emp832char"></div>
                                        </span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div class="shbox clearfix">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.advanced"></label>
                                <ul class="clearfix shbox_cont">
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.bandwidth"></label>
                                        <span class="right"><select class="text" et="change:htmode_change" id="htmode_58g"></select></span>
                                    </li>
                                    <li class="list clearfix">
                                        <label class="left" sh_lang="SHpack.channels"></label>
                                        <span class="right"><select class="text" id="channels_58g"></select></span></li>
                                </ul>
                            </div>
                        </div>
                        <span class="btn" et="click:prev" sh_lang="SHpack.prev"></span>
                        <span class="btn btn-warning" et="click:nextend" sh_lang="SHpack.next"></span>
                    </div>
                    <div class="wizard_box hide">
                        <div class="shbox clearfix">
                            <div class="shbox_border">
                                <label class="title" sh_lang="SHpack.bridge"></label>
                                <ul class="clearfix shbox_cont" id="readSet"></ul>
                            </div>
                        </div>
                        <span class="btn" et="click:prev" sh_lang="SHpack.prev"></span>
                        <span class="btn btn-warning" et="click:setmode" sh_lang="SHpack.finish"></span>
                    </div>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

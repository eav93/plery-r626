<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
	<style>
		body::-webkit-scrollbar {
		      display: none;
		   width: 0 !important;
		  }
	</style>
</head>
<body module="logs" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->

    <div class="content_box clearfix">
        <div class="content container-fluid clearfix">
            <div class="logs_box">
                <div class="row firewall_head">
                    <div class="col-xs-4">
                        <span sh_lang="SHpack.logs"></span>
                    </div>
                    <div class="col-xs-8 btngroup">
                        <a class="btn btn-warning" sh_lang="SHpack.refresh" et="click:log_now" id="btn-log"
                           disabled=""></a>
                    </div>
                </div>
                <div class="row">
                    <div class="col-xs-12 logs">
                        <table class="table" style="width: 100%;">
                            <thead>
                            <th style="width: 200px" sh_lang="SHpack.time"></th>
                            <th style="width:120px" sh_lang="SHpack.level"></th>
                            <th style="text-align: left;" sh_lang="SHpack.content"></th>
                            </thead>
                        </table>
                        <div id="logtext">
                            <table class="table" style="width: 100%;">
                                <thead style="border-bottom: none; display: none">
                                <th style="width: 200px"></th>
                                <th style="width:120px"></th>
                                <th></th>
                                </thead>
                                <tbody id="log_tab"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
</head>
<body module="iplimit" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->

    <div class="content_box clearfix">
        <div class="content container-fluid clearfix">
            <div class="firewall_tab">
                <div class="row firewall_head">
                    <div class="col-xs-4">
                        <span sh_lang="SHpack.ipLimit"></span>
                    </div>
                    <div class="col-xs-8 btngroup">
                        <a class="btn btn-warning" id="add" et="click:add" sh_lang="SHpack.add"></a>
                        <a class="btn btn-warning" id="del" et="click:delsele" sh_lang="SHpack.del"></a>
                    </div>
                </div>
                <div class="row">
                    <table width="100%">
                        <thead class="table_head">
                        <tr>
                            <th width="8%">
                                <input id="allchecked" type="checkbox" et="click:selectall" data-value="0"/>
                            </th>
                            <th width="8%" sh_lang="SHpack.number"></th>
                            <th width="20%" sh_lang="SHpack.ipLimitHost"></th>
                            <th width="10%" sh_lang="SHpack.ipLimitUpload"></th>
                            <th width="10%" sh_lang="SHpack.ipLimitDownload"></th>
                            <th width="10%" sh_lang="SHpack.ipLimitState"></th>
                            <th width="20%" sh_lang="SHpack.remarks"></th>
                            <th width="12%" sh_lang="SHpack.operation"></th>
                        </tr>
                        </thead>
                        <tbody id="ip_filters_table"></tbody>
                    </table>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>
<div class="mask"></div>
<input type="text" id="real_num" style="display: none"/>
<div class="add_box ip_add ">
    <div class="add_box_head">
        <i class="iconfont icon-cuowu" et="click:closewin"></i>
        <h4><span sh_lang="SHpack.add"></span><span sh_lang="SHpack.ipLimit"></span></h4>
    </div>
    <div class="add_box_body">
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row">
                    <span sh_lang="SHpack.ipLimitHost"></span>
                </div>
            </div>
            <div class="col-xs-8">
                <div class="row">
                    <input type="text" id="ipLimitHost" class="require isIp" maxlength="15"/>
                </div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.ipLimitUploadStor"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row">
                    <input type="text" id="ipLimitUpload" class="require isNum" name="_@1_999999" maxlength="6"/>
                </div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.ipLimitDownloadStor"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="ipLimitDownload" class="require isNum" name="_@1_999999" maxlength="6"/></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.ipLimitState"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row">
                    <select id="ipLimitState">
                        <option value="1" sh_lang="SHpack.enable"></option>
                        <option value="0" sh_lang="SHpack.disable"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.remarks"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="remarks" sh_lang="SHpack.remarks" maxlength="32"/></div>
            </div>
        </div>
    </div>
    <div class="add_box_foot clearfix">
        <button class="btn btn-warning pull-right firewall_save ifbtn" et="click:save"
                sh_lang="SHpack.save"></button>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

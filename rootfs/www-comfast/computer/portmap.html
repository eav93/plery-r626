<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css"/>
    <link rel="stylesheet" href="/css/pc/shap.css"/>
	<style>
			body::-webkit-scrollbar {
			      display: none;
			   width: 0 !important;
			  }
		</style>
</head>
<body module="portmap" device="computer" id="mbox_container">
<div class="container-fluid header">
    <div class="row">
        <div class="logo"><a id="logo_herf" target="_blank"><img src="/images/logo.png"></a></div>
        <ul class="out">
            <li id="login_out">
                <a href="#"><i class="iconfont icon-tuichu"></i><span sh_lang="SHpack.logout"></span></a>
            </li>
        </ul>
    </div>
</div>
<div class="wapper clearfix">
    <div class="subMenu clearfix" id="subMenu">
        <ul class="navigation clearfix"></ul>
    </div><!--#submenu-->

    <div class="content_box clearfix">
        <div class="content container-fluid clearfix">
            <div class="firewall_tab">
                <div class="row firewall_head">
                    <div class="col-xs-4">
                        <span sh_lang="SHpack.portmap" id="firewall"></span>
                    </div>
                    <div class="col-xs-8 btngroup">
                        <a class="btn btn-warning" id="add" data-name="url" et="click:add" sh_lang="SHpack.add"></a>
                        <a class="btn btn-warning" id="del" data-name="url" et="click:delsele" sh_lang="SHpack.del"></a>
                    </div>
                </div>
                <div class="row">
                    <table width="100%">
                        <thead class="table_head">
                        <tr>
                            <th width="10%">
                                <input id="allchecked" type="checkbox" et="click:selectall" data-value="0"/>
                                <label et="click:selectall" id="select_laber" sh_lang="SHpack.selectall"></label>
                            </th>
                            <th width="10%" sh_lang="SHpack.number"></th>
                            <th width="10%" sh_lang="SHpack.portmapp_name"></th>
                            <th width="20%" sh_lang="SHpack.proto"></th>
                            <th width="10%" sh_lang="SHpack.outer_port"></th>
                            <th width="10%" sh_lang="SHpack.inner_ip"></th>
                            <th width="20%" sh_lang="SHpack.inner_port"></th>
                            <th width="10%" sh_lang="SHpack.operation"></th>
                        </tr>
                        </thead>
                        <tbody id="url_filters_table">
                        </tbody>
                    </table>
                    <div class="page clearfix" id="url_page">
                        <div class="PageInfo clearfix"></div>
                        <ul class="clearfix PageCode"></ul>
                    </div>
                </div>
            </div>
            <div class="copyright" sh_lang="SHpack.copyright1"></div>
        </div>
    </div>
</div>
<div class="mask"></div>
<div class="add_box url_add">
    <div class="add_box_head">
        <i class="iconfont icon-cuowu" et="click:closewin"></i>
        <h4><span sh_lang="SHpack.portmap"></span></h4>
    </div>
    <div class="add_box_body">
        <div class="add_box_list clearfix hide">
            <div class="col-xs-4">
                <div class="row"><span></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" class="require" maxlength="32" id="real_num"></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.portmapp_name"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" class="require" maxlength="32" id="portmapp_name"></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.proto"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row">
                    <select class="require" id="portmapp_proto" et="change:protoselet">
                        <option value="both" >BOTH</option>
                        <option value="tcp" >TCP</option>
                        <option value="udp" >UDP</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.outer_port"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row">
                    <input type="text" class="require isNULL isPortSection" id="outer_port">
                </div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.inner_ip"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row">
                    <input type="text" class="require isIp placeholder" id="inner_ip">
                </div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.inner_port"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row">
                    <input type="text" class="require isNULL isPortSection" name="_@1_65535" id="inner_port">
                </div>
            </div>
        </div>
    </div>
    <div class="add_box_foot clearfix">
        <button class="btn btn-warning pull-right firewall_save ifbtn" et="click:save" sh_lang="SHpack.save"></button>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName], function (page) {
            page.init();
        });
    }
</script>

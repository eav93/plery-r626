<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <link type="image/x-icon" href="/images/favicon.ico"/>
    <link rel="stylesheet" href="/css/shreset.css">
    <link rel="stylesheet" href="/css/wap/shap.css">
    <title></title>
</head>
<body module="reboot" device="mobile" id="mbox_container">
<header class="is-fixed">
    <span class="goback" et="tap:prev"><i et="tap:prev" class="icon-prev"></i></span>
    <label sh_lang="SHpack.reboot"></label>
    <a class="header_menu" href="#"><span class="menu_icon"></span></a>
</header>
<main class="main_content container-fluid">
    <div class="shbox clearfix">
        <div class="shbox_border">
            <label class="title" sh_lang="SHpack.reboot"></label>
            <ul class="clearfix shbox_cont">
                <li class="list class">
                    <button class="btn btn-warning" href="javascript:void(0)" et="tap:reboot"
                            sh_lang="SHpack.reboot"></button>
                </li>
            </ul>
        </div>
        <div class="shbox clearfix">
            <div class="shbox_border">
                <label class="title" sh_lang="SHpack.time_reboot"></label>
                <ul class="clearfix shbox_cont">
                    <li class="list clearfix">
                        <label class="left" sh_lang="SHpack.time_reboot_switch"></label>
                        <span class="right">
                                    <select id="reboot_switch" class="text" et="change:reboot_switch">
                                        <option value="1" sh_lang="SHpack.enable"></option>
                                        <option value="0" sh_lang="SHpack.disable"></option>
                                    </select>
                                </span>
                    </li>
                    <li id="time_box" style="padding-top: 8px">
                        <ol class="list clearfix">
                            <div class="col-lg-8 col-sm-10 col-xs-12 col-lg-offset-2 col-sm-offset-1 col-xs-offset-0 weeks_check_0">
                                <div class="col-xs-3 text-center">
                                    <label for="weeks_all_0" sh_lang="SHpack.weeks_all"></label>
                                    <input type="checkbox" data-value="0" et="change:select_all_week" id="weeks_all_0"></div>
                                <div class="col-xs-3 text-center">
                                    <label for="weeks_0_1" sh_lang="SHpack.MON"></label>
                                    <input type="checkbox" data-value="0" et="change:select_one_week" class="week_0" id="weeks_0_1"></div>
                                <div class="col-xs-3 text-center">
                                    <label for="weeks_0_2" sh_lang="SHpack.TUE"></label>
                                    <input type="checkbox" data-value="0" et="change:select_one_week" class="week_0" id="weeks_0_2"></div>
                                <div class="col-xs-3 text-center">
                                    <label for="weeks_0_3" sh_lang="SHpack.WED"></label>
                                    <input type="checkbox" data-value="0" et="change:select_one_week" class="week_0" id="weeks_0_3"></div>
                                <div class="col-xs-3 text-center">
                                    <label for="weeks_0_4" sh_lang="SHpack.THU"></label>
                                    <input type="checkbox" data-value="0" et="change:select_one_week" class="week_0" id="weeks_0_4"></div>
                                <div class="col-xs-3 text-center">
                                    <label for="weeks_0_5" sh_lang="SHpack.FRI"></label>
                                    <input type="checkbox" data-value="0" et="change:select_one_week" class="week_0" id="weeks_0_5"></div>
                                <div class="col-xs-3 text-center">
                                    <label for="weeks_0_6" sh_lang="SHpack.SAT"></label>
                                    <input type="checkbox" data-value="0" et="change:select_one_week" class="week_0" id="weeks_0_6"></div>
                                <div class="col-xs-3 text-center">
                                    <label for="weeks_0_0" sh_lang="SHpack.SUN"></label>
                                    <input type="checkbox" data-value="0" et="change:select_one_week" class="week_0" id="weeks_0_0"></div>
                            </div>
                        </ol>
                        <ol class="list clearfix">
                            <label class="left" sh_lang="SHpack.timing_reboot_time"></label>
                            <span class="right">
                                    <input type="text" class="text require isTime" sh_lang="SHpack.hour_clock_24" id="time_reboot">
                                <p style="font-size: 12px;color: #a8a8a8;line-height: 16px;" sh_lang="SHpack.hour_clock_24"></p>
                                </span>
                        </ol>
                    </li>
                    <li class="list clearfix">
                        <label class="left" sh_lang="SHpack.interval_reboot"></label>
                        <span class="right">
                                    <select id="interval_switch" class="text" et="change:interval_switch">
                                        <option value="1" sh_lang="SHpack.enable"></option>
                                        <option value="0" sh_lang="SHpack.disable"></option>
                                    </select>
                                </span>
                    </li>
                    <li id="interval_box" style="padding-top: 8px">
                        <ol class="list clearfix">
                            <label class="left" sh_lang="SHpack.interval_replay_time"></label>
                            <span class="right">
                                <input type="text" class="text require isInterval" style="width: 80%" name="@1-65535" id="interval_time">
                                 <label sh_lang="SHpack.hour"></label>
                            </span>
                        </ol>
                    </li>

                    <li class="list clearfix" style="text-align: center">
                        <button class="btn btn-warning" et="tap:reboot_config" sh_lang="SHpack.modify"></button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="login_footer">
            <div sh_lang="SHpack.copyright"></div>
        </div>
    </div>
</main>
<nav class="subMenu" id="subMenu">
    <ul class="navigation clearfix"></ul>
</nav>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName, "touch"], function (page) {
            page.init();
        });
    }
</script>

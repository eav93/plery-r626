<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico"/>
    <link rel="stylesheet" href="/css/shreset.css">
    <link rel="stylesheet" href="/css/wap/shap.css">
</head>
<body module="arp" device="mobile" id="mbox_container">
<header class="is-fixed">
    <span class="goback" et="tap:prev"><i et="tap:prev" class="icon-prev"></i></span>
    <label sh_lang="SHpack.arp"></label>
    <a class="header_menu" href="#"><span class="menu_icon"></span></a>
</header>
<main class="main_content container-fluid">
    <ul class="wizard clearfix">
        <div class="firewall_tab">
            <div class="row firewall_head">
                <!-- <div class="col-xs-4">
                    <span sh_lang="SHpack.arp" id="firewall"></span>
                </div> -->
                <div class="btngroup">
                    <a class="btn btn-warning" id="add" data-name="arp" et="click:add" sh_lang="SHpack.add"></a>
                    <a class="btn btn-warning" id="del" data-name="arp" et="click:delsele" sh_lang="SHpack.del"></a>
                </div>
            </div>
            <div class="row">
                <div class="tableContent">
                    <table style="width: 150%">
                        <thead class="table_head">
                        <tr>
                            <th width="10%">
                                <input id="allchecked" type="checkbox" et="click:selectall" data-value="0"/>
                            </th>
                            <th width="10%" sh_lang="SHpack.number"></th>
                            <th width="20%" sh_lang="SHpack.ip_addr"></th>
                            <th width="20%" sh_lang="SHpack.mac"></th>
                            <th width="10%" sh_lang="SHpack.net_group"></th>
                            <th width="10%" sh_lang="SHpack.remarks"></th>
                            <th width="10%" sh_lang="SHpack.status"></th>
                            <th width="10%" sh_lang="SHpack.operation"></th>
                        </tr>
                        </thead>
                        <tbody id="arp_table">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </ul>
    <div class="row">
        <div class="login_footer">
            <div sh_lang="SHpack.copyright"></div>
        </div>
    </div>
</main>
<nav class="subMenu" id="subMenu">
    <ul class="navigation clearfix"></ul>
</nav>
<div class="mask"></div>
<input type="text" id="real_num" style="display: none"/>
<div class="add_box arp_add">
    <div class="add_box_head">
        <i class="iconfont icon-cuowu" et="click:closewin"></i>
        <h4><span sh_lang="SHpack.add"></span><span sh_lang="SHpack.arp"></span></h4>
    </div>
    <div class="add_box_body">
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.ip_addr"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="arp_ip_src" class="require isIp" sh_lang="SHeg.ip"/></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.mac"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="arp_mac_src" class="require isMac" sh_lang="SHeg.mac"/></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row">
                    <span sh_lang="SHpack.net_group"></span>
                </div>
            </div>
            <div class="col-xs-8">
                <div class="row">
                    <select id="arp_ifname_src">
                        <option value="wan">WAN</option>
                        <option value="lan">LAN</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.remarks"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="arp_remark_src" sh_lang="SHpack.remarks" maxlength="32"/></div>
            </div>
        </div>
    </div>
    <div class="add_box_foot clearfix">
        <button class="btn btn-warning pull-right firewall_save ifbtn" sh_lang="SHpack.save" et="click:save"></button>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName, "touch"], function (page) {
            page.init();
        });
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <link type="image/x-icon" href="/images/favicon.ico"/>
    <link rel="stylesheet" href="/css/shreset.css">
    <link rel="stylesheet" href="/css/wap/shap.css">
    <title></title>
</head>
<body module="wireless" device="mobile" id="mbox_container">
<header class="is-fixed">
    <span class="goback" et="tap:prev"><i et="tap:prev" class="icon-prev"></i></span>
    <label sh_lang="SHpack.wireless"></label>
    <a class="header_menu" href="#"><span class="menu_icon"></span></a>
</header>
<main class="main_content container-fluid">
    <div class="double_wifi wificont clearfix">
        <ul class="wire_tabs">
            <li class="name_24g active" sh_lang="SHpack.wifi24g"></li>
            <li class="name_58g" sh_lang="SHpack.wifi58g"></li>
        </ul>
        <div class="wire_boxs">
            <div class="alone_wifi clearfix show" id="wifi_24g">
                <div class="wifi_box_24g">
                    <div class="shbox clearfix">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.wifi24g"></label>
                            <ul class="wifi_24g clearfix ">
                                <li class="clearfix wifi_box row manger hide" id="wifi_manger_24g">
                                    <div class="col-xs-4">
                                        <div class="row"><label class="col-xs-3 ">
                                            <div class="row"><span sh_lang="SHpack.ssid"></span></div>
                                        </label><span class="col-xs-9 "><input class="text require isSSID" type="text"
                                                                               id="ssid_manger_24g"></span></div>
                                    </div>
                                    <div class="col-xs-4">
                                        <div class="row"><label class="col-xs-4">
                                            <div class="row"><span sh_lang="SHpack.ssid_psk"></span></div>
                                        </label><span class="col-xs-8 "><input class="text require isSSIDPwd"
                                                                               type="text"
                                                                               id="passwd_manger_24g"></span>
                                        </div>
                                    </div>
                                    <div class="col-xs-4">
                                        <div class="row">
                                            <div class="col-xs-4 ">
                                                <div class="row">
                                                    <input type="checkbox" autocomplete="off" disabled="disabled"
                                                           id="hidden_manger_24g" checked class="hide">
                                                    <label for="hidden_manger_24g" class="iconfont hidden_ssid"></label>
                                                </div>
                                            </div>
                                            <div class="col-xs-8">
                                                <div class="row">
                                                    <input type="checkbox" id="disabled_manger_24g" class="MCB"
                                                           style="display: none;">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </li>
                                <li class="row">
                                    <span sh_lang="SHpack.advanced"></span>
                                    <span class="adv_box" data-value="checkbox_24g">
                                        <input type="checkbox" autocomplete="off" id="checkbox_24g" class="MCB">
                                    </span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="shbox clearfix advanced hide checkbox_24g">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.advanced"></label>
                            <ul class="clearfix shbox_cont">
                                <li class="list clearfix">
                                    <label sh_lang="SHpack.bandwidth" class="left"></label>
                                    <span class="right">
                                        <select class="text" id="bandwidth_24g"></select>
                                    </span>
                                </li>
                                <li class="list clearfix hidden">
                                    <label class="left" sh_lang="SHpack.hwmode"></label>
                                    <span class="right">
                                        <select class="text" id="hwmode_24g"></select>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label sh_lang="SHpack.country" class="left"></label>
                                    <span class="right">
                                        <select class="text country" id="country_24g"
                                                et="change:country_channel">
                                                <option value="UK" sh_lang="SHpack.country_es"></option>
                                            <option value="CN" sh_lang="SHpack.country_cn"></option>
                                            <option value="US" sh_lang="SHpack.country_us"></option>
                                            <option value="GB" sh_lang="SHpack.country_eu"></option>
                                        </select>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.channels"></label>
                                    <span class="right">
                                        <select class="text" id="channels_24g"></select>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.txpower"></label>
                                    <span class="right">
                                            <input type="text" class="text require isTxpower" sh_lang="SHtips.ispower" id="txpower_24g">
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.maxassoc"></label>
                                    <span class="right">
                                        <input type="text" class="text require isassoc" sh_lang="SHeg.isassoc"
                                               id="maxassoc_24g">
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.frag"></label>
                                    <span class="right">
                                            <input class="text require isfrag" sh_lang='SHeg.isfrag' type="text"
                                                   id="frag_24g">
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.rts"></label>
                                    <span class="right">
                                            <input class="text require isrts" sh_lang='SHeg.isrts' type="text"
                                                   id="rts_24g">
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.rekey"></label>
                                    <span class="right">
                                            <input type="checkbox" autocomplete="off" id="rekey_24g" class="MCB"/>
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.wds"></label>
                                    <span class="right">
                                        <input type="checkbox" autocomplete="off" id="wds_24g" class="MCB"/>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.isolate"></label>
                                    <span class="right">
                                        <input type="checkbox" autocomplete="off" id="isolate_24g" class="MCB"/>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.wmm"></label>
                                    <span class="right">
                                        <input type="checkbox" autocomplete="off" id="wmm_24g" class="MCB"/>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.shortgi"></label>
                                    <span class="right">
                                           <input type="checkbox" autocomplete="off" id="shortgi_24g" class="MCB"/>
                                        </span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <div class="alone_wifi clearfix" id="wifi_58g">
                <div class="wifi_box_58g">
                    <div class="shbox clearfix">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.wifi58g"></label>
                            <ul class="wifi_58g clearfix">
                                <li class="clearfix wifi_box row manger hide" id="wifi_manger_58g">
                                    <div class="col-xs-4">
                                        <div class="row"><label class="col-xs-3 ">
                                            <div class="row"><span sh_lang="SHpack.ssid"></span></div>
                                        </label><span class="col-xs-9 "><input class="text require isSSID" type="text"
                                                                               id="ssid_manger_58g"></span></div>
                                    </div>
                                    <div class="col-xs-4">
                                        <div class="row"><label class="col-xs-4">
                                            <div class="row"><span sh_lang="SHpack.ssid_psk"></span></div>
                                        </label><span class="col-xs-8 "><input class="text require isSSIDPwd"
                                                                               type="text"
                                                                               id="passwd_manger_58g"></span>
                                        </div>
                                    </div>
                                    <div class="col-xs-4">
                                        <div class="row">
                                            <div class="col-xs-4 ">
                                                <div class="row">
                                                    <input type="checkbox" autocomplete="off" id="hidden_manger_58g"
                                                           checked
                                                           class="hide">
                                                    <label for="hidden_manger_58g" class="iconfont hidden_ssid"></label>
                                                </div>
                                            </div>
                                            <div class="col-xs-8">
                                                <div class="row">
                                                    <input type="checkbox" id="disabled_manger_58g" class="MCB"
                                                           style="display: none;">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </li>
                                <li class="row">
                                    <span sh_lang="SHpack.advanced"></span>
                                    <span class="adv_box" data-value="checkbox_58g">
                                        <input type="checkbox" autocomplete="off" id="checkbox_58g" class="MCB">
                                    </span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="shbox clearfix advanced hide checkbox_58g">
                        <div class="shbox_border">
                            <label class="title" sh_lang="SHpack.advanced"></label>
                            <ul class="clearfix shbox_cont">
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.bandwidth"></label>
                                    <span class="right">
                                            <select class="text" et="change:htmode_channel" id="bandwidth_58g"></select>
                                        </span>
                                </li>
                                <li class="list clearfix hidden">
                                    <label class="left" sh_lang="SHpack.hwmode"></label>
                                    <span class="right">
                                            <select class="text" id="hwmode_58g"></select>
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.country"></label>
                                    <span class="right">
                                            <select class="text country" id="country_58g"
                                                    et="change:country_channel">
                                                    <option value="UK" sh_lang="SHpack.country_es"></option>
                                                <option value="CN" sh_lang="SHpack.country_cn"></option>
                                                <option value="US" sh_lang="SHpack.country_us"></option>
                                                <option value="GB" sh_lang="SHpack.country_eu"></option>
                                            </select>
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.channels"></label>
                                    <span class="right">
                                            <select class="text" id="channels_58g"></select>
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.txpower"></label>
                                    <span class="right">
                                            <input type="text" class="text require isTxpower" sh_lang="SHtips.ispower" id="txpower_58g">
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.maxassoc"></label>
                                    <span class="right">
                                            <input type="text" class="text require isassoc" sh_lang="SHeg.isassoc"
                                                   id="maxassoc_58g">
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.frag"></label>
                                    <span class="right">
                                            <input class="text require isfrag" sh_lang='SHeg.isfrag' type="text"
                                                   id="frag_58g">
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.rts"></label>
                                    <span class="right">
                                            <input class="text require isrts" sh_lang='SHeg.isrts' type="text"
                                                   id="rts_58g">
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.rekey"></label>
                                    <span class="right">
                                            <input type="checkbox" autocomplete="off" id="rekey_58g" class="MCB"/>
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.wds"></label>
                                    <span class="right">
                                            <input type="checkbox" autocomplete="off" id="wds_58g" class="MCB"/>
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.isolate"></label>
                                    <span class="right">
                                            <input type="checkbox" autocomplete="off" id="isolate_58g" class="MCB"/>
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.wmm"></label>
                                    <span class="right">
                                            <input type="checkbox" autocomplete="off" id="wmm_58g" class="MCB"/>
                                        </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.shortgi"></label>
                                    <span class="right">
                                           <input type="checkbox" autocomplete="off" id="shortgi_58g" class="MCB"/>
                                        </span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <button class="btn btn-warning" sh_lang="SHpack.optimised" et="tap:setmode"></button>

    <div class="row">
        <div class="login_footer">
            <div sh_lang="SHpack.copyright"></div>
        </div>
    </div>
</main>
<nav class="subMenu" id="subMenu">
    <ul class="navigation clearfix"></ul>
</nav>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName, "touch"], function (page) {
            page.init();
        });
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <link type="image/x-icon" href="/images/favicon.ico"/>
    <link rel="stylesheet" href="/css/shreset.css">
    <link rel="stylesheet" href="/css/wap/shap.css">
    <title></title>
	<style type="text/css">
		@media screen and (max-width:320px) {
			.user_mac{
				max-width: 55px;
				overflow: hidden !important;
				text-overflow: ellipsis !important;
				white-space: nowrap !important;
			}
			.user_name{
				max-width:55px !important;
				white-space: pre-wrap !important;
				overflow: hidden !important;
				text-overflow: ellipsis !important;
			}
		}
	</style>
</head>
<body module="usersreal" device="mobile" id="mbox_container">
<header class="is-fixed">
    <span class="goback" et="tap:prev"><i et="tap:prev" class="icon-prev"></i></span>
    <label sh_lang="SHpack.users"></label>
    <a class="header_menu" href="#"><span class="menu_icon"></span></a>
</header>
<main class="main_content container-fluid">
    <div class="shbox clearfix">
        <div class="shbox_border">
            <label class="title" sh_lang="SHpack.currentdevice"></label>
            <div class="clearfix shbox_cont user_tab">
                <table width="100%">
                    <thead class="table_head">
                    <tr>
                        <th width="10%" sh_lang="SHpack.devname"></th>
                        <th width="16%" class="hide-xs">IP</th>
                        <th width="16%" class="thmacs">MAC</th>
                        <th width="10%" class="hide-xs" sh_lang="SHpack.uplink"></th>
                        <th width="10%" sh_lang="SHpack.downlink"></th>
                        <th width="10%" class="hide-xs" sh_lang="SHpack.ontime"></th>
                        <th width="10%" sh_lang="SHpack.operation"></th>
                    </tr>
                    </thead>
                    <tbody id="user_tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="shbox clearfix">
        <div class="shbox_border">
            <label class="title" sh_lang="SHpack.nointernet"></label>
            <div class="clearfix shbox_cont user_tab">
                <table width="100%">
                    <thead class="table_head">
                    <tr>
                        <th width="12%" sh_lang="SHpack.devname"></th>
                        <th width="16%">MAC</th>
                        <th width="10%" sh_lang="SHpack.operation"></th>
                    </tr>
                    </thead>
                    <tbody id="black_info">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<nav class="subMenu" id="subMenu">
    <ul class="navigation clearfix"></ul>
</nav>
<div class="mask"></div>
<input type="text" id="real_num" class="hide"/>
<div class="add_box hide">
    <div class="add_box_head">
        <i class="iconfont icon-cuowu" et="tap:closewin"></i>
        <h4><span sh_lang="SHpack.add"></span><span sh_lang="SHpack.mac_filter"></span></h4>
    </div>
    <div class="add_box_body">
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.mac"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="mac_src" class="require isMac" sh_lang="SHeg.mac"/></div>
            </div>
        </div>
        <div class="add_box_list clearfix">
            <div class="col-xs-4">
                <div class="row"><span sh_lang="SHpack.remarks"></span></div>
            </div>
            <div class="col-xs-8">
                <div class="row"><input type="text" id="mac_reamek" sh_lang="SHpack.remarks"/></div>
            </div>
        </div>
    </div>
    <div class="add_box_foot clearfix">
        <button class="btn btn-warning pull-right firewall_save ifbtn" et="tap:save" sh_lang="SHpack.save"></button>
    </div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName, "touch"], function (page) {
            page.init();
        });
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <link type="image/x-icon" href="/images/favicon.ico"/>
    <link rel="stylesheet" href="/css/shreset.css">
    <link rel="stylesheet" href="/css/wap/shap.css">
    <title></title>
</head>
<body module="4g_double_router" device="mobile" id="mbox_container">
<header class="is-fixed">
    <span class="goback" et="tap:prev"><i et="tap:prev" class="icon-prev"></i></span>
    <label sh_lang="SHpack.router"></label>
    <a class="header_menu" href="#"><span class="menu_icon"></span></a>
</header>
<main class="main_content container-fluid">
    <div class="shstep"></div>
    <div class="wizard_man">
        <div class="wizard_box ">
            <div class="shbox clearfix">
                <div class="shbox_border">
                    <label class="title" sh_lang="SHpack.wan_set"></label>
                    <div class="clearfix">
                        <ul class="radio_tabs four clearfix">
                            <li><input type="radio" id="card_addr_id" name="addr_ip"
                                       value="card"><label for="card_addr_id" sh_lang="SHpack.apn_mode"></label>
                            </li>
                            <li><input type="radio" id="pppoe_addr_id" name="addr_ip" value="pppoe"><label
                                    for="pppoe_addr_id" sh_lang="SHpack.pppoe"></label></li>
                            <li><input type="radio" id="static_addr_id" name="addr_ip" value="static"><label
                                    for="static_addr_id" sh_lang="SHpack.staAddress"></label></li>
                            <li><input type="radio" id="dhcp_addr_id" name="addr_ip" value="dhcp"><label
                                    for="dhcp_addr_id" sh_lang="SHpack.dyAddress"></label></li>
                        </ul>
                        <div class="radio_boxs">
                            <div class="tabbox_cont cont">
                                    <div class="list clearfix">
                                        <label class="left" sh_lang="SHpack.protocol"></label>
                                        <span class="right place">
                                                        <select class="text" id="lte_protocol">
                                                            <option value="qmi">qmi</option>
                                                            <option value="ppp_quectel">ppp_quectel</option>
                                                        </select>
                                                    </span>
                                    </div>
                                    <div class="list clearfix">
                                        <label class="left" sh_lang="SHpack.apninfo"></label>
                                        <span class="right place">
                                                        <select class="text" id="apn_detect" et="change:apn_detect">
                                                            <option value="1" sh_lang="SHpack.apn_auto"></option>
                                                            <option value="0" sh_lang="SHpack.apn_nanual"></option>
                                                        </select>
                                                    </span>
                                    </div>
                                    <div id="apn_msg" class="list hidden">
                                        <div class="clearfix">
                                            <label class="left" sh_lang="SHpack.apn"></label>
                                            <span class="right place">
                                                            <input type="text" class="text require isNonull" id="lte_apn">
                                                        </span>
                                        </div>
                                        <div class="list clearfix">
                                            <label class="left" sh_lang="SHpack.apn_user"></label>
                                            <span class="right place">
                                                            <input type="text" class="text" id="lte_username">
                                                        </span>
                                        </div>
                                        <div class="list clearfix">
                                            <label class="left" sh_lang="SHpack.apn_psd"></label>
                                            <span class="right place">
                                                            <input type="text" class="text" id="lte_password">
                                                        </span>
                                        </div>
                                    </div>
                            </div>
                            <ul class="tabbox_cont cont">
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.pppoe_name"></label>
                                    <span class="right">
                                        <input type="text" id="pppoe_user_id" sh_lang="SHeg.max63char"
                                               class="text require isPPPoeName">
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.pppoe_psd"></label>
                                    <span class="right">
                                                <input type="password" id="pppoe_pwd_id" sh_lang="SHeg.max63char"
                                                       class="text require isPPPoePwd">
                                            </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left">MTU</label>
                                    <span class="right">
                                                <input type="text" id="mtu" sh_lang="SHeg.ismtu"
                                                       class="text require isMTU">
                                            </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.pppoe_sever_name"></label>
                                    <span class="right">
                                                <input type="text" id="pppoe_server_id" sh_lang="SHeg.max63char"
                                                       class="text require isServerName">
                                            </span>
                                </li>
                            </ul>
                            <ul class="tabbox_cont cont">
                                <li class=" list clearfix">
                                    <label class="left" sh_lang="SHpack.ip_addr"></label>
                                    <span class="right">
                                        <input type="text" id="static_ip_id" sh_lang="SHeg.ip" class="text require isIp"
                                               autocomplete="off">
                                    </span>
                                </li>
                                <li class=" list clearfix">
                                    <label class="left" sh_lang="SHpack.netmask"></label>
                                    <span class="right">
                                        <select type="text" class="text" id="static_netmask_id">
                                            <option value="255.255.255.252">255.255.255.252</option>
                                            <option value="255.255.255.248">255.255.255.248</option>
                                            <option value="255.255.255.240">255.255.255.240</option>
                                            <option value="255.255.255.224">255.255.255.224</option>
                                            <option value="255.255.255.192">255.255.255.192</option>
                                            <option value="255.255.255.128">255.255.255.128</option>
                                            <option value="255.255.255.0" selected>255.255.255.0</option>
                                            <option value="255.255.254.0">255.255.254.0</option>
                                            <option value="255.255.252.0">255.255.252.0</option>
                                            <option value="255.255.248.0">255.255.248.0</option>
                                            <option value="255.255.240.0">255.255.240.0</option>
                                            <option value="255.255.224.0">255.255.224.0</option>
                                            <option value="255.255.192.0">255.255.192.0</option>
                                            <option value="255.255.128.0">255.255.128.0</option>
                                            <option value="255.255.0.0">255.255.0.0</option>
                                            <option value="255.254.0.0">255.254.0.0</option>
                                            <option value="255.252.0.0">255.252.0.0</option>
                                            <option value="255.248.0.0">255.248.0.0</option>
                                            <option value="255.240.0.0">255.240.0.0</option>
                                            <option value="255.224.0.0">255.224.0.0</option>
                                            <option value="255.192.0.0">255.192.0.0</option>
                                            <option value="255.128.0.0">255.128.0.0</option>
                                            <option value="255.0.0.0">255.0.0.0</option>
                                        </select>
                                    </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.gateway"></label>
                                    <span class="right">
                                                    <input type="text" id="static_gateway_id" sh_lang="SHeg.gateway"
                                                           class="text require isGateway" autocomplete="off">
                                                </span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.dns"></label>
                                    <span class="right"><input type="text" id="static_dns_id" sh_lang="SHeg.dns"
                                                               class="text require isDNS" autocomplete="off"></span>
                                </li>
                            </ul>
                            <ul class="tabbox_cont cont hide">
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.ip_addr"></label>
                                    <span class="right"><input class="text" id="dhcp_ip_id" sh_lang="SHeg.auto"
                                                               disabled="" type="text"></span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.netmask"></label>
                                    <span class="right"><input class="text" id="dhcp_netmask_id" sh_lang="SHeg.auto"
                                                               disabled="" type="text"></span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.gateway"></label>
                                    <span class="right"><input class="text" id="dhcp_gateway_id" sh_lang="SHeg.auto"
                                                               disabled="" type="text"></span>
                                </li>
                                <li class="list clearfix">
                                    <label class="left" sh_lang="SHpack.dns"></label>
                                    <span class="right"><input class="text" id="dhcp_dns_id" sh_lang="SHeg.auto"
                                                               disabled="" type="text"></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <span class="btn btn-warning" et="tap:next" sh_lang="SHpack.next"></span>
        </div>
        <div class="wizard_box hide">
            <div class="shbox clearfix">
                <div class="shbox_border">
                    <label class="title" sh_lang="SHpack.lan_set"></label>
                    <ul class="clearfix shbox_cont">
                        <li class="clearfix list">
                            <label class="left" sh_lang="SHpack.ip_addr"></label>
                            <span class="right">
                                <input id="lan_ip_id" sh_lang="SHeg.ip" class="text require isIp" type="text"
                                       autocomplete="off" value="">
                            </span>
                        </li>
                        <li class="clearfix list">
                            <label class="left" sh_lang="SHpack.netmask"></label>
                            <span class="right">
                                <select type="text" class="text" id="lan_netmask_id">
                                            <option value="255.255.255.252">255.255.255.252</option>
                                            <option value="255.255.255.248">255.255.255.248</option>
                                            <option value="255.255.255.240">255.255.255.240</option>
                                            <option value="255.255.255.224">255.255.255.224</option>
                                            <option value="255.255.255.192">255.255.255.192</option>
                                            <option value="255.255.255.128">255.255.255.128</option>
                                            <option value="255.255.255.0">255.255.255.0</option>
                                            <option value="255.255.254.0">255.255.254.0</option>
                                            <option value="255.255.252.0">255.255.252.0</option>
                                            <option value="255.255.248.0">255.255.248.0</option>
                                            <option value="255.255.240.0">255.255.240.0</option>
                                            <option value="255.255.224.0">255.255.224.0</option>
                                            <option value="255.255.192.0">255.255.192.0</option>
                                            <option value="255.255.128.0">255.255.128.0</option>
                                            <option value="255.255.0.0">255.255.0.0</option>
                                            <option value="255.254.0.0">255.254.0.0</option>
                                            <option value="255.252.0.0">255.252.0.0</option>
                                            <option value="255.248.0.0">255.248.0.0</option>
                                            <option value="255.240.0.0">255.240.0.0</option>
                                            <option value="255.224.0.0">255.224.0.0</option>
                                            <option value="255.192.0.0">255.192.0.0</option>
                                            <option value="255.128.0.0">255.128.0.0</option>
                                            <option value="255.0.0.0">255.0.0.0</option>
                                        </select>
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
            <span class="btn btn-warning" et="tap:next" sh_lang="SHpack.next"></span>
        </div>

        <div class="wizard_box w24g hide">
            <div class="shbox clearfix">
                <div class="shbox_border">
                    <label class="title" sh_lang="SHpack.wifi24g"></label>
                    <ul class="clearfix shbox_cont">
                        <li class="list clearfix">
                            <label class="left" sh_lang="SHpack.ssid"></label>
                            <span class="right">
                                <input sh_lang="SHeg.max32char" id="ssid_id_24g" class="text require isSSID"
                                       type="text">
                            </span>
                        </li>
                        <li class="list clearfix">
                            <label class="left" sh_lang="SHpack.ssid_pwd"></label>
                            <span class="right">
                                <input sh_lang="SHeg.emp832char" id="psk_id_24g" class="text require isSSIDPwd"
                                       type="text">
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="shbox clearfix">
                <div class="shbox_border">
                    <label class="title" sh_lang="SHpack.advanced"></label>
                    <ul class="clearfix shbox_cont">
                        <li class="clearfix list">
                            <label class="left" sh_lang="SHpack.bandwidth"></label>
                            <span class="right">
                                <select class="text" id="bandwidth_24g"></select>
                            </span>
                        </li>
                        <li class="clearfix list">
                            <label class="left" sh_lang="SHpack.country"></label>
                            <span class="right">
                                <select class="text country" id="country_24g" et="change:country_channel">
                                    <option value="UK" sh_lang="SHpack.country_es"></option>
                                    <option value="CN" sh_lang="SHpack.country_cn"></option>
                                    <option value="US" sh_lang="SHpack.country_us"></option>
                                    <option value="GB" sh_lang="SHpack.country_eu"></option>
                                </select>
                            </span>
                        </li>
                        <li class="clearfix list">
                            <label class="left" sh_lang="SHpack.channels"></label>
                            <span class="right">
                                <select class="text" id="channels_24g"></select>
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
            <span class="btn btn-warning" et="tap:nextend" sh_lang="SHpack.next"></span>
        </div>
        <div class="wizard_box w58g hide">
            <div class="shbox clearfix">
                <div class="shbox_border">
                    <label class="title" sh_lang="SHpack.wifi58g"></label>
                    <ul class="clearfix shbox_cont">
                        <li class="list clearfix">
                            <label class="left" sh_lang="SHpack.ssid"></label>
                            <span class="right">
                                <input sh_lang="SHeg.max32char" id="ssid_id_58g" class="text require isSSID"
                                       type="text">
                            </span>
                        </li>
                        <li class="list clearfix">
                            <label class="left" sh_lang="SHpack.ssid_pwd"></label>
                            <span class="right">
                                <input sh_lang="SHeg.emp832char" id="psk_id_58g" class="text require isSSIDPwd"
                                       type="text">
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="shbox clearfix">
                <div class="shbox_border">
                    <label class="title" sh_lang="SHpack.advanced"></label>
                    <ul class="clearfix shbox_cont">
                        <li class="clearfix list">
                            <label class="left" sh_lang="SHpack.bandwidth"></label>
                            <span class="right">
                                <select class="text" et="change:htmode_channel" id="bandwidth_58g"></select>
                            </span>
                        </li>
                        <li class="clearfix list">
                            <label class="left" sh_lang="SHpack.country"></label>
                            <span class="right">
                                <select class="text country" id="country_58g" et="change:country_channel">
                                    <option value="UK" sh_lang="SHpack.country_es"></option>
                                    <option value="CN" sh_lang="SHpack.country_cn"></option>
                                    <option value="US" sh_lang="SHpack.country_us"></option>
                                    <option value="GB" sh_lang="SHpack.country_eu"></option>
                                </select>
                            </span>
                        </li>
                        <li class="clearfix list">
                            <label class="left" sh_lang="SHpack.channels"></label>
                            <span class="right">
                                <select class="text" id="channels_58g"></select>
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
            <span class="btn btn-warning" et="tap:nextend" sh_lang="SHpack.next"></span>
        </div>
        <div class="wizard_box hide">
            <div class="shbox clearfix">
                <div class="shbox_border">
                    <label class="title" sh_lang="SHpack.router"></label>
                    <ul class="clearfix shbox_cont" id="readSet"></ul>
                </div>
            </div>
            <button class="btn btn-warning" et="tap:setmode" sh_lang="SHpack.finish"></button>
        </div>
    </div>
    <div class="row">
        <div class="login_footer">
            <div sh_lang="SHpack.copyright"></div>
        </div>
    </div>
    <div class="row">
        <div class="login_footer">
            <div sh_lang="SHpack.copyright"></div>
        </div>
    </div>
</main>
<nav class="subMenu" id="subMenu">
    <ul class="navigation clearfix"></ul>
</nav>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName, "touch"], function (page) {
            page.init();
        });
    }
</script>

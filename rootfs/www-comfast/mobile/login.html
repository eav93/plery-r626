<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <link type="image/x-icon" href="/images/favicon.ico" rel="shortcut icon"/>
    <link rel="stylesheet" href="/css/shreset.css">
    <link rel="stylesheet" href="/css/wap/login.css">
    <style type="text/css">
        a:focus {
            outline: none;
        }

        h3 {
            text-shadow: 0 2px #ccc;
        }

        .tc {
            text-align: center;
        }

        #navs {
            position: fixed;
            left: 120px;
            bottom: 4px;
            width: 40px;
            height: 40px;
            line-height: 40px;
            list-style-type: none;
            margin: 0;
            padding: 0;
            text-align: center;
            color: #fff;
            cursor: pointer;
        }

        #navs > li, #navs:after {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            -webkit-border-radius: 50%;
            background-color: #cd6f00;
        }

        #navs > li {
            transition: all .6s;
            -webkit-transition: all .6s;
            -moz-transition: .6s;
        }

        #navs:after {
            content: attr(data-close);
            z-index: 1;
            border-radius: 50%;
            -webkit-border-radius: 50%;
        }

        #navs.active:after {
            content: attr(data-open);
        }

        #navs a {
            width: 40px;
            height: 40px;
            display: inline-block;
            border-radius: 50%;
            -webkit-border-radius: 50%;
            text-decoration: none;
            color: #fff;
            font-size: 0.8em;
        }
        .login_footer {
            height: 30px;
            background-color: #1d1e1f;
            color: #b3b3b3;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .psdbox {
            position: relative;
        }
        .icon-duoyuyan, .icon-lock {
            position: absolute;
            bottom: 13px;
            left: 13px;
            color: #fff;
        }
        /* 下拉框 */
        .selectDiv {
            position: relative;
            font-size: 14px;
            width: 100%;
            height: 42px;
            background: #da9f1b;
            box-shadow: 0 2px 3px 0 rgba(0, 0, 0, .1) inset;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .1);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 6px;
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .myselect {
            position: absolute;
            width: 100%;
            height: 42px;
            left: 0;
            top: 0;
            opacity: 0;
            color: #000;
        }

        .icon-right {
            position: absolute;
            right: 10px;
            top: 14px;
            border-right: 2px solid;
            border-bottom: 2px solid;
            transform: rotate(45deg);
            width: 8px;
            height: 8px;
            color: #fff;
        }
        #selected {
            color: #fff;
        }
    </style>
</head>
<body id="mbox_container" device="mobile" module="login">
<div class="page-container logo clearfix" id="login_area">
    <h1><a id="logo_herf" target="_blank"><img src="/images/logo.png"/></a></h1>
    <div class="selectDiv">
        <span class="icon-duoyuyan"></span>
        <div class="icon-right"></div>
        <span id="selected">Русский</span>
        <select class="myselect" id="l_select" et="change:language_change">
            <option value="ru">Русский</option>
            <option value="en">English</option>
            <option value="cn">简体中文</option>
        </select>
    </div>
    <div class="psdbox hide" id="newpsdbox">
        <input type="text" class="password" id="newpsd" sh_lang="SHpack.login_tips">
    </div>
    <div class="psdbox hide" id="passwordbox">
        <input type="password" class="password" id="password" sh_lang="SHpack.login_tips">
    </div>
    <button type="submit" id="login_btn" class="submit_button" et="tap:login"></button>
</div>

<div class="login_footer">
    <div sh_lang="SHpack.copyright"></div>
</div>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName, "touch"], function (page) {
            page.init();
        });
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <link type="image/x-icon" href="/images/favicon.ico"/>
    <link rel="stylesheet" href="/css/shreset.css">
    <link rel="stylesheet" href="/css/wap/shap.css">
    <title></title>
</head>
<body module="led" device="mobile" id="mbox_container">
<header class="is-fixed">
    <span class="goback" et="tap:prev"><i et="tap:prev" class="icon-prev"></i></span>
    <label sh_lang="SHpack.led_swich"></label>
    <a class="header_menu" href="#"><span class="menu_icon"></span></a>
</header>
<main class="main_content container-fluid">
    <div class="shbox clearfix" id="wan_info">
        <div class="shbox_border">
            <label class="title" sh_lang="SHpack.led_swich"></label>
            <ul class="clearfix shbox_cont">
                <li class="list clearfix">
                    <label class="left" sh_lang="SHpack.led_swich"></label>
                    <span class="right">
                        <select id="led_switch" class="text" et="change:remote_change">
                            <option value="on" sh_lang="SHpack.enable"></option>
                            <option value="off" sh_lang="SHpack.disable"></option>
                        </select>
                    </span>
                </li>
            </ul>
        </div>
        <button class="btn btn-warning" sh_lang="SHpack.optimised" et="tap:modify_remote"></button>
    </div>
    <div class="row">
        <div class="login_footer">
            <div sh_lang="SHpack.copyright"></div>
        </div>
    </div>
</main>
<nav class="subMenu" id="subMenu">
    <ul class="navigation clearfix"></ul>
</nav>
</body>
</html>
<script type="text/javascript" src="/common/sea.js"></script>
<script type="text/javascript">
    var moduleName = document.body.getAttribute("module");
    if (moduleName) {
        seajs.use([moduleName, "touch"], function (page) {
            page.init();
        });
    }
</script>

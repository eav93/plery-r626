name: Build Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      keep_langs:
        description: 'UI languages to keep (e.g. en,ru)'
        default: 'en,ru'

env:
  KEEP_LANGS: ${{ inputs.keep_langs || 'en,ru' }}
  SDK_NAME: lede-sdk-17.01.7-ramips-mt7628_gcc-5.4.0_musl-1.1.16.Linux-x86_64
  FWTOOL_COMMIT: 04cd252e4e9394ffacd51f56f1f124abc534f715

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y squashfs-tools perl bc

      # ---- fwtool ----
      - name: Cache fwtool
        uses: actions/cache@v5
        id: fwtool-cache
        with:
          path: fwtool/fwtool
          key: fwtool-${{ env.FWTOOL_COMMIT }}

      - name: Build fwtool
        if: steps.fwtool-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://git.openwrt.org/project/fwtool.git fwtool
          cd fwtool && git checkout -q ${{ env.FWTOOL_COMMIT }}
          cc -o fwtool fwtool.c -Wall -O2

      # ---- LEDE SDK (for wbsrv cross-compile) ----
      - name: Cache LEDE SDK
        uses: actions/cache@v5
        id: sdk-cache
        with:
          path: ${{ env.SDK_NAME }}.tar.xz
          key: ${{ env.SDK_NAME }}

      - name: Download LEDE SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          wget -q "https://archive.openwrt.org/releases/17.01.7/targets/ramips/mt7628/${{ env.SDK_NAME }}.tar.xz"

      - name: Extract SDK
        run: tar xf ${{ env.SDK_NAME }}.tar.xz

      # ---- libuci (lede-17.01) ----
      - name: Clone libuci
        run: |
          rm -rf libuci
          git clone -q -b lede-17.01 --depth=1 https://github.com/openwrt/uci libuci
          printf '#ifndef _UCI_CONFIG_H\n#define _UCI_CONFIG_H\n#define UCI_PREFIX "/usr"\n#endif\n' \
            > libuci/uci_config.h

      # ---- Build wbsrv ----
      - name: Build wbsrv (MIPS)
        env:
          STAGING_DIR: ${{ github.workspace }}/${{ env.SDK_NAME }}/staging_dir
        run: |
          cd webserver
          make cross \
            SDK_DIR=${{ github.workspace }}/${{ env.SDK_NAME }} \
            LIBUCI_DIR=${{ github.workspace }}/libuci
          cp wbsrv ../rootfs/usr/sbin/wbsrv
          file ../rootfs/usr/sbin/wbsrv

      # ---- Node.js (shared for CSS minification + Vue build) ----
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: ui/node_modules
          key: ui-node-${{ hashFiles('ui/package.json') }}

      - name: Build Vue UI
        run: |
          cd ui
          npm install --prefer-offline
          npm run build

      # ---- CSS minification ----
      - name: Minify CSS
        run: |
          find rootfs/www-comfast/css -type f -name '*.css' \
            -exec sh -c 'for f; do npx -y -p csso-cli csso -i "$f" -o "$f"; done' sh {} +

      # ---- Firmware version ----
      - name: Set firmware version
        run: |
          MAJOR=2
          BUILD_NUM=${GITHUB_RUN_NUMBER}
          C1=$(( BUILD_NUM / (33 * 33) ))
          C2=$(( (BUILD_NUM / 33) % 33 ))
          C3=$(( BUILD_NUM % 33 ))
          [ "$C1" -gt 32 ] && C1=32
          VERSION="CF-PLERY-R626-eav93-V${MAJOR}.${C1}.${C2}.${C3}"
          echo "FIRMWARE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      # ---- Build firmware (inlined from build.sh) ----
      - name: Build firmware
        run: |
          set -euo pipefail

          OUTPUT="dist/${FIRMWARE_VERSION}.bin"
          mkdir -p dist

          # Prune locales
          LANG_JS="rootfs/www-comfast/js/language.js"
          KEEP_LANGS_SET=",${{ env.KEEP_LANGS }},"
          for lang in cn en ru; do
            if [[ "$KEEP_LANGS_SET" != *",$lang,"* ]]; then
              perl -i -ne "next if /^\s*'$lang'\s*:\s*'[^']*'\s*,?\s*$/; print;" "$LANG_JS"
              perl -0777 -i -pe "s/\n\s*'$lang'\s*:\s*\{[^{}]*\}\s*,?//gs" "$LANG_JS"
            fi
          done
          perl -0777 -i -pe 's/,\n(\s*})/\n$1/g' "$LANG_JS"

          # Build workspace
          BUILD_ROOT=$(mktemp -d /tmp/rootfs_build_XXXXXX)
          trap "rm -rf '$BUILD_ROOT'" EXIT
          cp -a rootfs/. "$BUILD_ROOT/"

          # Write version
          echo -n "$FIRMWARE_VERSION" > "$BUILD_ROOT/etc/defconfig/cf-plery/version"

          # Required empty dirs
          for dir in dev etc/crontabs etc/easy-rsa/pki/private etc/easy-rsa/pki/reqs \
                     etc/hotplug.d/ntp etc/openvpn/ccd etc/ssl/certs etc/ssl/private \
                     lib/firmware mnt overlay proc root sys tmp usr/lib/opkg/lists \
                     www www-comfast/upload; do
            mkdir -p "$BUILD_ROOT/$dir"
          done
          chmod 1777 "$BUILD_ROOT/tmp"

          # Remove build artifacts
          find "$BUILD_ROOT" -name ".DS_Store" -delete 2>/dev/null || true
          find "$BUILD_ROOT" -name ".gitkeep"  -delete 2>/dev/null || true

          # Build SquashFS
          SQUASHFS_TMP=$(mktemp /tmp/rootfs_XXXXXX.squashfs)
          XZ_BCJ_OPT=""
          mksquashfs -help-comp xz 2>&1 | grep -q mips && XZ_BCJ_OPT="-Xbcj mips"
          mksquashfs "$BUILD_ROOT" "$SQUASHFS_TMP" \
            -comp xz $XZ_BCJ_OPT -Xdict-size 100% \
            -b 262144 -nopad -noappend -no-xattrs -all-root -quiet

          KERNEL_SIZE=$(stat -c%s kernel.bin)
          SQUASHFS_SIZE=$(stat -c%s "$SQUASHFS_TMP")
          BODY_SIZE=$(( KERNEL_SIZE + SQUASHFS_SIZE ))
          MAX_IMAGE=$(( 0xFB0000 - 0x100000 ))

          echo "Kernel:   $KERNEL_SIZE bytes"
          echo "SquashFS: $SQUASHFS_SIZE bytes"
          echo "Total:    $BODY_SIZE / $MAX_IMAGE ($(( BODY_SIZE * 100 / MAX_IMAGE ))% used)"

          [ "$BODY_SIZE" -le "$MAX_IMAGE" ] || { echo "Firmware too large!"; exit 1; }

          # Assemble + metadata
          RAW_FW="/tmp/firmware_raw_$$.bin"
          cat kernel.bin "$SQUASHFS_TMP" > "$RAW_FW"
          fwtool/fwtool -I metadata.json "$RAW_FW"
          fwtool/fwtool -i /dev/stdout "$RAW_FW"
          mv "$RAW_FW" "$OUTPUT"

          FINAL_SIZE=$(stat -c%s "$OUTPUT")
          echo "Built: $OUTPUT ($FINAL_SIZE bytes)"

      # ---- Verify ----
      - name: Verify firmware
        run: |
          FW="dist/${FIRMWARE_VERSION}.bin"
          SQFS_OFF=1435702
          ERRORS=0

          K_MD5=$(dd if="$FW" bs=1 count=$SQFS_OFF 2>/dev/null | md5sum | awk '{print $1}')
          [ "$K_MD5" = "0b76b2b44cd46a4a93f1ac20941d57ee" ] \
            && echo "Kernel OK" \
            || { echo "::error::Kernel mismatch: $K_MD5"; ERRORS=$((ERRORS+1)); }

          dd if="$FW" bs=1 skip=$SQFS_OFF of=/tmp/rootfs.squashfs 2>/dev/null
          unsquashfs -d /tmp/rootfs -f /tmp/rootfs.squashfs

          for b in usr/sbin/wbsrv usr/bin/webmgnt; do
            [ -f "/tmp/rootfs/$b" ] && echo "$b OK" \
              || { echo "::error::Missing /$b"; ERRORS=$((ERRORS+1)); }
          done

          for d in dev proc sys tmp overlay root mnt; do
            [ -d "/tmp/rootfs/$d" ] && echo "/$d OK" \
              || { echo "::error::Missing dir /$d"; ERRORS=$((ERRORS+1)); }
          done

          [ $ERRORS -eq 0 ] || exit 1
          echo "All checks passed"

      # ---- Release ----
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FIRMWARE_VERSION }}
          path: dist/*.bin

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.FIRMWARE_VERSION }}" \
            dist/*.bin \
            --title "${{ env.FIRMWARE_VERSION }}" \
            --notes "Commit: $(git rev-parse --short HEAD)"

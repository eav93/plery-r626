name: Build Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Cache LEDE SDK
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: lede-sdk.tar.xz
          key: lede-sdk-17.01.7-ramips-mt7628

      - name: Download LEDE SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          wget -q "https://archive.lede-project.org/releases/17.01.7/targets/ramips/mt7628/lede-sdk-17.01.7-ramips-mt7628_gcc-5.4.0_musl-1.1.16.Linux-x86_64.tar.xz" \
            -O lede-sdk.tar.xz

      - name: Extract SDK
        run: |
          tar xf lede-sdk.tar.xz
          echo "SDK_DIR=${{ github.workspace }}/lede-sdk-17.01.7-ramips-mt7628_gcc-5.4.0_musl-1.1.16.Linux-x86_64" >> $GITHUB_ENV

      - name: Build wbsrv (MIPS)
        run: |
          cd webserver
          make cross SDK_DIR=${{ env.SDK_DIR }}
          cp wbsrv ../rootfs/usr/sbin/wbsrv
          echo "wbsrv: $(file ../rootfs/usr/sbin/wbsrv)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Minify CSS
        run: |
          find rootfs/www-comfast/css -type f -name '*.css' \
            -exec sh -c 'for f do npx -y -p csso-cli csso -i "$f" -o "$f"; done' sh {} +

      - name: Set firmware version
        run: |
          MAJOR=2
          BUILD_NUM=${GITHUB_RUN_NUMBER}
          C1=$(( BUILD_NUM / (33 * 33) ))
          C2=$(( (BUILD_NUM / 33) % 33 ))
          C3=$(( BUILD_NUM % 33 ))
          [ "$C1" -gt 32 ] && C1=32
          VERSION="CF-PLERY-R626-eav93-V${MAJOR}.${C1}.${C2}.${C3}"
          echo "FIRMWARE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Firmware version: $VERSION"

      - name: Build firmware
        run: |
          chmod +x build.sh
          FIRMWARE_VERSION=${{ env.FIRMWARE_VERSION }} ./build.sh "${{ env.FIRMWARE_VERSION }}.bin"

      - name: Verify firmware
        run: |
          FW=dist/${{ env.FIRMWARE_VERSION }}.bin
          SQFS_OFF=1435702
          KERNEL_MD5_EXPECT="0b76b2b44cd46a4a93f1ac20941d57ee"
          ERRORS=0

          echo "=== Kernel ==="
          K_MD5=$(dd if="$FW" bs=1 count=$SQFS_OFF 2>/dev/null | md5sum | awk '{print $1}')
          if [ "$K_MD5" = "$KERNEL_MD5_EXPECT" ]; then
            echo "Kernel V2.0.1.4 OK"
          else
            echo "::error::Kernel mismatch! Got $K_MD5, expected $KERNEL_MD5_EXPECT"
            ERRORS=$((ERRORS+1))
          fi

          echo "=== SquashFS ==="
          dd if="$FW" bs=1 skip=$SQFS_OFF of=/tmp/rootfs.squashfs 2>/dev/null
          mkdir -p /tmp/rootfs
          unsquashfs -d /tmp/rootfs -f /tmp/rootfs.squashfs

          echo "=== Critical binaries ==="
          for b in usr/sbin/wbsrv usr/bin/webmgnt; do
            if [ -f "/tmp/rootfs/$b" ]; then
              echo "$b present ($(file /tmp/rootfs/$b | grep -o 'ELF.*'))"
            else
              echo "::error::Missing: /$b"
              ERRORS=$((ERRORS+1))
            fi
          done

          echo "=== Critical directories ==="
          for d in dev proc sys tmp overlay root mnt; do
            if [ ! -d "/tmp/rootfs/$d" ]; then
              echo "::error::Missing directory: /$d"
              ERRORS=$((ERRORS+1))
            fi
          done

          echo "=== Build artifacts ==="
          GK=$(find /tmp/rootfs -name '.gitkeep' | wc -l)
          DS=$(find /tmp/rootfs -name '.DS_Store' | wc -l)
          [ "$GK" -gt 0 ] || [ "$DS" -gt 0 ] && echo "::warning::Build artifacts found in image"

          echo "=== fwtool metadata ==="
          MAGIC=$(xxd -l 4 -s -8 "$FW" | awk '{print $2$3}')
          echo "Trailer magic: $MAGIC"

          [ $ERRORS -eq 0 ] || { echo "::error::Firmware verification failed"; exit 1; }
          echo "Firmware verification passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_VERSION }}
          path: dist/*.bin

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.FIRMWARE_VERSION }}" \
            dist/*.bin \
            --title "${{ env.FIRMWARE_VERSION }}" \
            --notes "Firmware build from commit $(git rev-parse --short HEAD)"

name: Build Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Compile fwtool
        run: cc -o fwtool fwtool.c -Wall -O2

      - name: Write firmware version
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          VERSION="Plery-R626-V2.0.1.4-EU-${COMMIT_SHORT}"
          echo -n "$VERSION" > rootfs/etc/defconfig/cf-plery/version
          echo "FIRMWARE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Firmware version: $VERSION"

      - name: Build firmware
        run: |
          chmod +x build.sh
          ./build.sh "${{ env.FIRMWARE_VERSION }}.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_VERSION }}
          path: "*.bin"

name: Build Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Build mksquashfs with MIPS BCJ support
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev liblzma-dev liblz4-dev libzstd-dev
          git clone --depth 1 https://github.com/plougher/squashfs-tools.git /tmp/squashfs-tools
          cd /tmp/squashfs-tools/squashfs-tools
          # Add MIPS BCJ filter patch
          sed -i 's/{"arm", LZMA_FILTER_ARMTHUMB}/{"arm", LZMA_FILTER_ARMTHUMB},\n\t{"mips", LZMA_FILTER_MIPSEL}/' xz_wrapper.c
          sed -i 's/{"arm", LZMA_FILTER_ARMTHUMB}/{"arm", LZMA_FILTER_ARMTHUMB},\n\t{"mips", LZMA_FILTER_MIPSEL}/' unsquashfs_xz.c 2>/dev/null || true
          make -j$(nproc)
          sudo cp mksquashfs unsquashfs /usr/local/bin/

      - name: Set firmware version
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          VERSION="Plery-R626-eav93-${COMMIT_SHORT}"
          echo "FIRMWARE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Firmware version: $VERSION"

      - name: Build firmware
        run: |
          chmod +x build.sh
          ./build.sh "${{ env.FIRMWARE_VERSION }}.bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FIRMWARE_VERSION }}
          path: dist/*.bin

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.FIRMWARE_VERSION }}" \
            dist/*.bin \
            --title "${{ env.FIRMWARE_VERSION }}" \
            --notes "Firmware build from commit $(git rev-parse --short HEAD)"

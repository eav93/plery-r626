name: Build Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend payload (no package.json)
        run: |
          echo "Frontend size before minify:"
          du -sh rootfs/www-comfast

          # Minify CSS in-place
          find rootfs/www-comfast/css -type f -name '*.css' \
            -exec sh -c 'for f do npx -y -p csso-cli csso -i "$f" -o "$f"; done' sh {} +

          # Keep JS unminified: legacy SeaJS modules break under aggressive terser passes.
          echo "Frontend size after minify:"
          du -sh rootfs/www-comfast

      - name: Set firmware version
        run: |
          # compare_version in libshared.so zeroes any component >= 33.
          # Keep all four numeric components in range 0..32.
          MAJOR=2
          BUILD_NUM=${GITHUB_RUN_NUMBER}
          C1=$(( BUILD_NUM / (33 * 33) ))
          C2=$(( (BUILD_NUM / 33) % 33 ))
          C3=$(( BUILD_NUM % 33 ))

          # Clamp C1 as well to stay within compare_version constraints.
          if [ "$C1" -gt 32 ]; then
            C1=32
          fi

          VERSION="CF-PLERY-R626-eav93-V${MAJOR}.${C1}.${C2}.${C3}"
          echo "FIRMWARE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Firmware version: $VERSION"

      - name: Build firmware
        run: |
          chmod +x build.sh
          ./build.sh "${{ env.FIRMWARE_VERSION }}.bin"

      - name: Verify firmware
        run: |
          FW=dist/${{ env.FIRMWARE_VERSION }}.bin
          SQFS_OFF=1435702
          KERNEL_MD5_EXPECT="0b76b2b44cd46a4a93f1ac20941d57ee"
          ERRORS=0

          echo "=== Kernel ==="
          K_MD5=$(dd if="$FW" bs=1 count=$SQFS_OFF 2>/dev/null | md5sum | awk '{print $1}')
          if [ "$K_MD5" = "$KERNEL_MD5_EXPECT" ]; then
            echo "Kernel V2.0.1.4 ✓"
          else
            echo "::error::Kernel mismatch! Got $K_MD5, expected $KERNEL_MD5_EXPECT"
            ERRORS=$((ERRORS+1))
          fi

          echo "=== SquashFS ==="
          dd if="$FW" bs=1 skip=$SQFS_OFF of=/tmp/rootfs.squashfs 2>/dev/null
          mkdir -p /tmp/rootfs
          unsquashfs -d /tmp/rootfs -f /tmp/rootfs.squashfs

          echo "=== Critical directories ==="
          for d in dev proc sys tmp overlay root mnt; do
            if [ ! -d "/tmp/rootfs/$d" ]; then
              echo "::error::Missing directory: /$d"
              ERRORS=$((ERRORS+1))
            fi
          done
          [ $ERRORS -eq 0 ] && echo "All directories present ✓"

          echo "=== Artifacts ==="
          GK=$(find /tmp/rootfs -name '.gitkeep' | wc -l)
          DS=$(find /tmp/rootfs -name '.DS_Store' | wc -l)
          echo ".gitkeep: $GK  .DS_Store: $DS"
          if [ "$GK" -gt 0 ] || [ "$DS" -gt 0 ]; then
            echo "::warning::Build artifacts found in image"
          fi

          echo "=== fwtool metadata ==="
          MAGIC=$(xxd -l 4 -s -8 "$FW" | awk '{print $2$3}')
          echo "Trailer magic: $MAGIC"

          if [ $ERRORS -gt 0 ]; then
            echo "::error::Firmware verification failed with $ERRORS errors"
            exit 1
          fi
          echo "Firmware verification passed ✓"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FIRMWARE_VERSION }}
          path: dist/*.bin

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.FIRMWARE_VERSION }}" \
            dist/*.bin \
            --title "${{ env.FIRMWARE_VERSION }}" \
            --notes "Firmware build from commit $(git rev-parse --short HEAD)"

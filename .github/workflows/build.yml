name: Build Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Set firmware version
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          VERSION="Plery-R626-V2.0.1.4-EU-${COMMIT_SHORT}"
          echo "FIRMWARE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Firmware version: $VERSION"

      - name: Build firmware
        run: |
          chmod +x build.sh
          ./build.sh "${{ env.FIRMWARE_VERSION }}.bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_VERSION }}
          path: dist/*.bin

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.FIRMWARE_VERSION }}" \
            dist/*.bin \
            --title "${{ env.FIRMWARE_VERSION }}" \
            --notes "Firmware build from commit $(git rev-parse --short HEAD)"

name: Build wbsrv (MIPS)

on:
  push:
    paths:
      - 'webserver/**'
      - '.github/workflows/webserver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache LEDE SDK
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: lede-sdk.tar.xz
          key: lede-sdk-17.01.7-ramips-mt7628

      - name: Download LEDE SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          wget -q "https://archive.lede-project.org/releases/17.01.7/targets/ramips/mt7628/lede-sdk-17.01.7-ramips-mt7628_gcc-5.4.0_musl-1.1.16.Linux-x86_64.tar.xz" \
            -O lede-sdk.tar.xz

      - name: Extract SDK
        run: tar xf lede-sdk.tar.xz

      - name: Build
        run: |
          cd webserver
          make cross SDK_DIR=${{ github.workspace }}/lede-sdk-17.01.7-ramips-mt7628_gcc-5.4.0_musl-1.1.16.Linux-x86_64
          echo "Built: $(file wbsrv)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wbsrv-mips
          path: webserver/wbsrv
